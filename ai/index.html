  'use strict';
  var KEY = 'zzh-auth';

        localStorage.removeItem(KEY);
        localStorage.removeItem('zzh-cek');
        localStorage.removeItem('zzh-pkey');
        localStorage.removeItem('zzh-gh-token');
      } catch (e) {}
      location.reload();
    }

  var btn = document.getElementById('zzh-auth-chip-logout');

    btn.addEventListener('click', function (e) {
      e.preventDefault();
      window.ZzhAuth.logout();
    });
  }

PQwDlinm9iemM5JgNkvY7PJsLvyVs/Wk8ijSP+3BX/WVv17XHOezJ7qlRPtt5nJHu/ATxlCRZ007kgj4qvROYogjVuVkc4Api5wB7XcT+ODPQvUAaIn8G3I+zhqztgn5jNmXyR70KvE2QYcDJUpHWrz2jrqbAd8KgzyFeHNxjjtGgHzBOH20vfp5CKVDY/EAMpTqnPN9qz8sZUp5YZdj852RM66yL5uEnGYsYcukn8LLNLr7P6qVDvuWP71GWd/L1RqG7v8pbKVaX3Od1YxagJNAkibSIj6EDp29KM7fWwEm"}</script><script src="/zzh-notes/js/zzh-decrypt.js"></script></div></div></div></main><footer class="footer"><div class="footer-inner"><div class="copyright">&copy; <span itemprop="copyrightYear">2026</span> <span class="with-love"><i class="fa fa-heart"></i> </span><span class="author" itemprop="copyrightHolder">ZZH</span></div><div class="powered-by">由 <a href="https://hexo.io/" rel="noopener" target="_blank">Hexo</a> & <a href="https://theme-next.js.org/" rel="noopener" target="_blank">NexT.Gemini</a> 强力驱动</div></div></footer><div class="back-to-top" role="button" aria-label="返回顶部"><i class="fa fa-arrow-up fa-lg"></i> <span>0%</span></div><noscript><div class="noscript-warning">Theme NexT works best with JavaScript enabled</div></noscript><div class="reading-progress-bar" aria-hidden="true"></div><script defer src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script><script defer src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script><script>window.addEventListener('load', function () {
  // 工程兜底 1：尊重 prefers-reduced-motion，直接返回（内容保持可见）
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    return;
  }

  // 工程兜底 2：检查 GSAP 是否加载成功
  if (typeof gsap === 'undefined' || typeof ScrollTrigger === 'undefined') {
    console.warn('[ZZH] GSAP 未加载，动效跳过，内容保持可见');
    return;
  }

  // 工程兜底 3（新增）：恢复函数。任何动效代码抛异常时调用，
  // 把所有 fade-up 元素的 opacity 强制设回 1，保证内容可见。
  // 这是对 gsap-ready gate 的补充——原 gate 只防"GSAP 加载失败"，
  // 但"GSAP 加载成功后我的代码崩了"会导致内容永久 opacity:0，需要额外兜底。
  function revealAllFadeUp() {
    document.querySelectorAll('.fade-up').forEach(function (el) {
      el.style.opacity = '1';
      el.style.transform = 'none';
    });
    document.querySelectorAll('.post-body img').forEach(function (img) {
      img.style.opacity = '1';
    });
  }

  gsap.registerPlugin(ScrollTrigger);

  // 工程兜底 4：加 gsap-ready 类，激活 .fade-up 的初始 opacity:0
  // 这一步在 GSAP 确认可用后才做，保证加载失败时内容不消失
  document.documentElement.classList.add('gsap-ready');

  // 整个动效逻辑包进 try/catch：任何一段崩了都不能让内容永久隐藏
  try {

    // === 动效 1：阅读进度条 ===
    var bar = document.querySelector('.reading-progress-bar');
    if (bar) {
      ScrollTrigger.create({
        trigger: document.body,
        start: 'top top',
        end: 'bottom bottom',
        onUpdate: function (self) {
          bar.style.transform = 'scaleX(' + self.progress + ')';
        }
      });
    }

    // === 动效 2：首页文章卡片 stagger fade-up ===
    // 解密注入的内容不做入场动画（post-cipher 的既定约定）：注入顶层元素带
    // data-zzh-injected 标记。window.load 晚于注入完成时，若给已可见元素补
    // fade-up，会先被 CSS 归零 opacity 再淡入，形成一次重闪。
    function inInjected(el) { return !!(el.closest && el.closest('[data-zzh-injected]')); }
    var allCards = document.querySelectorAll('.posts-expand .post-block');
    var cards = [];
    allCards.forEach(function (c) { if (!inInjected(c)) cards.push(c); });
    if (cards.length) {
      cards.forEach(function (c) { c.classList.add('fade-up'); });
      gsap.to(cards, {
        opacity: 1,
        y: 0,
        duration: 0.5,
        stagger: 0.08,
        ease: 'power2.out',
        scrollTrigger: {
          trigger: '.posts-expand',
          start: 'top 85%'
        }
      });
    }

    // === 动效 3：文章页 H2/H3 fade-up ===
    // 注意：批量 gsap.to 不能用 trigger 函数（之前 bug：trigger: h => h
    // 会让 ScrollTrigger 调用 h.getBoundingClientRect()，但函数没有该方法，
    // 抛 TypeError 让整个动效链条中断，导致卡片永远 opacity:0）。
    // 正确做法：forEach 每个 heading 单独 gsap.to，trigger 直接传元素本身。
    var allHeadings = document.querySelectorAll('.post-body h2, .post-body h3');
    var headings = [];
    allHeadings.forEach(function (h) { if (!inInjected(h)) headings.push(h); });
    if (headings.length) {
      headings.forEach(function (h) {
        h.classList.add('fade-up');
        gsap.to(h, {
          opacity: 1,
          y: 0,
          duration: 0.4,
          ease: 'power2.out',
          scrollTrigger: {
            trigger: h,
            start: 'top 90%'
          }
        });
      });
    }

    // === 动效 4：文章图片 lazyload fade-in ===
    // 这段不走 GSAP，纯 JS 设 inline style。初始 opacity:0 由 inline style 控制，
    // 不依赖 gsap-ready class，所以 try/catch 不影响它。
    // 但加 onError 兜底：图片加载失败也要恢复 opacity，否则永久不可见。
    // ⚠ 门禁页（正文加密）的 .post-body 内容是解密后才注入的（注入脚本派发
    // page:loaded），只在本 load 跑一次会漏掉它们——图留着 CSS 初始 opacity:0
