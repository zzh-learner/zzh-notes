  'use strict';
  var KEY = 'zzh-auth';
  window.ZzhAuth = {
    read: function () {
      try {
        var raw = localStorage.getItem(KEY);
        if (!raw) return null;
        var s = JSON.parse(raw);
        if (!s || typeof s.u !== 'string' ||
            (s.r !== 'admin' && s.r !== 'user') ||
            typeof s.e !== 'number' || s.e <= Date.now()) {
          localStorage.removeItem(KEY);
          localStorage.removeItem('zzh-gh-token'); // 会话过期即清写作台令牌（登出/过期同清，与 logout() 同步）
          return null;
        }
        return s;
      } catch (e) { return null; }
    },
    logout: function () {
      // 登出四键同清：'zzh-cek'（内容密钥）、'zzh-pkey'（私密板块密钥，仅 admin）、
      // 'zzh-gh-token'（写作台访问令牌，仅 admin）与 'zzh-auth'（登录态）同生共死。
      // 同步副本：scripts/login-page.js 的 logout()（含写作台键）与 scripts/zzh-post-cipher.js
      // 注入脚本的 GCM 失败清理——三处改一处必须同步其余（会话多键 + 私钥约定）。
      try {
        localStorage.removeItem(KEY);
        localStorage.removeItem('zzh-cek');
        localStorage.removeItem('zzh-pkey');
        localStorage.removeItem('zzh-gh-token');
      } catch (e) {}
      location.reload();
    }
  };
  var s = window.ZzhAuth.read();
  var chip = document.getElementById('zzh-auth-chip');
  if (s && chip) {
    chip.hidden = false;
    var name = chip.querySelector('.zzh-auth-chip-name');
    if (name) name.textContent = s.u;
    if (s.r === 'admin') chip.classList.add('is-admin');
  }
  // 私密板块入口：仅 admin 会话显示（登出 logout() reload 后本脚本重跑即隐藏）
  var priv = document.getElementById('zzh-private-nav');
  if (priv) priv.hidden = !(s && s.r === 'admin');
  var btn = document.getElementById('zzh-auth-chip-logout');
  if (btn) {
    btn.addEventListener('click', function (e) {
      e.preventDefault();
      window.ZzhAuth.logout();
    });
  }
})();</script></header></div><div class="main-inner index posts-expand"><div class="zzh-gate" id="zzh-gate">

  // 工程兜底 1：尊重 prefers-reduced-motion，直接返回（内容保持可见）
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    return;
  }

  // 工程兜底 2：检查 GSAP 是否加载成功
  if (typeof gsap === 'undefined' || typeof ScrollTrigger === 'undefined') {
    console.warn('[ZZH] GSAP 未加载，动效跳过，内容保持可见');
    return;
  }

  // 工程兜底 3（新增）：恢复函数。任何动效代码抛异常时调用，
  // 把所有 fade-up 元素的 opacity 强制设回 1，保证内容可见。
  // 这是对 gsap-ready gate 的补充——原 gate 只防"GSAP 加载失败"，
  // 但"GSAP 加载成功后我的代码崩了"会导致内容永久 opacity:0，需要额外兜底。
  function revealAllFadeUp() {
    document.querySelectorAll('.fade-up').forEach(function (el) {
      el.style.opacity = '1';
      el.style.transform = 'none';
    });
    document.querySelectorAll('.post-body img').forEach(function (img) {
      img.style.opacity = '1';
    });
  }

  gsap.registerPlugin(ScrollTrigger);

  // 工程兜底 4：加 gsap-ready 类，激活 .fade-up 的初始 opacity:0
  // 这一步在 GSAP 确认可用后才做，保证加载失败时内容不消失
  document.documentElement.classList.add('gsap-ready');

  // 整个动效逻辑包进 try/catch：任何一段崩了都不能让内容永久隐藏
  try {

    // === 动效 1：阅读进度条 ===
    var bar = document.querySelector('.reading-progress-bar');
    if (bar) {
      ScrollTrigger.create({
        trigger: document.body,
        start: 'top top',
        end: 'bottom bottom',
        onUpdate: function (self) {
          bar.style.transform = 'scaleX(' + self.progress + ')';
        }
      });
    }

    // === 动效 2：首页文章卡片 stagger fade-up ===
    // 解密注入的内容不做入场动画（post-cipher 的既定约定）：注入顶层元素带
    // data-zzh-injected 标记。window.load 晚于注入完成时，若给已可见元素补
    // fade-up，会先被 CSS 归零 opacity 再淡入，形成一次重闪。
    function inInjected(el) { return !!(el.closest && el.closest('[data-zzh-injected]')); }
    var allCards = document.querySelectorAll('.posts-expand .post-block');
    var cards = [];
    allCards.forEach(function (c) { if (!inInjected(c)) cards.push(c); });
    if (cards.length) {
      cards.forEach(function (c) { c.classList.add('fade-up'); });
      gsap.to(cards, {
        opacity: 1,
        y: 0,
        duration: 0.5,
        stagger: 0.08,
        ease: 'power2.out',
        scrollTrigger: {
          trigger: '.posts-expand',
          start: 'top 85%'
        }
      });
    }

    // === 动效 3：文章页 H2/H3 fade-up ===
    // 注意：批量 gsap.to 不能用 trigger 函数（之前 bug：trigger: h => h
    // 会让 ScrollTrigger 调用 h.getBoundingClientRect()，但函数没有该方法，
    // 抛 TypeError 让整个动效链条中断，导致卡片永远 opacity:0）。
    // 正确做法：forEach 每个 heading 单独 gsap.to，trigger 直接传元素本身。
    var allHeadings = document.querySelectorAll('.post-body h2, .post-body h3');
    var headings = [];
    allHeadings.forEach(function (h) { if (!inInjected(h)) headings.push(h); });
    if (headings.length) {
      headings.forEach(function (h) {
        h.classList.add('fade-up');
        gsap.to(h, {
          opacity: 1,
          y: 0,
          duration: 0.4,
          ease: 'power2.out',
          scrollTrigger: {
            trigger: h,
            start: 'top 90%'
          }
        });
      });
    }

    // === 动效 4：文章图片 lazyload fade-in ===
    // 这段不走 GSAP，纯 JS 设 inline style。初始 opacity:0 由 inline style 控制，
    // 不依赖 gsap-ready class，所以 try/catch 不影响它。
    // 但加 onError 兜底：图片加载失败也要恢复 opacity，否则永久不可见。
    // ⚠ 门禁页（正文加密）的 .post-body 内容是解密后才注入的（注入脚本派发
    // page:loaded），只在本 load 跑一次会漏掉它们——图留着 CSS 初始 opacity:0
    // 永久不可见。所以封装成函数，load 与 page:loaded 各跑一遍（幂等）。
    var revealImages = function () {
      document.querySelectorAll('.post-body img').forEach(function (img) {
        if (img.complete && img.naturalWidth > 0) {
          img.style.opacity = 1;
        } else {
          img.style.opacity = 0;
          img.style.transition = 'opacity 0.3s ease';
          img.addEventListener('load', function () { img.style.opacity = 1; });
          img.addEventListener('error', function () { img.style.opacity = 1; });
        }
      });
    };
    revealImages();
    document.addEventListener('page:loaded', revealImages);

    // === header 滚动收缩 ===
    var header = document.querySelector('.custom-header');
    if (header) {
      ScrollTrigger.create({
        trigger: document.body,
        start: 'top -80',
        end: 99999,
        toggleClass: { targets: header, className: 'scrolled' }
      });
    }

  } catch (err) {
    // 兜底：任何动效代码崩了，恢复所有 fade-up 和图片可见
    console.error('[ZZH] 动效代码异常，已恢复内容可见：', err);
    revealAllFadeUp();
  }

  var maxC = tags.reduce(function (m, t) { return Math.max(m, t.count); }, 1);

  function fontOf(t, scale) {

  var items = tags.map(function (t) {

    return a / (W * H);
  }

  // ⑦ 自适应铺满：放不下(<90%) → 缩小 15%；放得下但不饱满(<30%) → 放大 15% 重试
  function layout(ctx, W, H) {
    var scale = 1, bestScale = 0, bestPlaced = null, lastOk = false;
    for (var round = 0; round < 6; round++) {
      var placed = attempt(ctx, W, H, scale);
      if (placed.length >= items.length * 0.9) {
        bestScale = scale; bestPlaced = placed; lastOk = true;
        if (coverageOf(placed, W, H) >= 0.3 || scale > 2.2) break;
        scale *= 1.15;
      } else {
        lastOk = false;
        scale *= 0.85;
        if (bestPlaced) break;
      }
    }
    if (bestPlaced && !lastOk) bestPlaced = attempt(ctx, W, H, bestScale);
    return bestPlaced;
  }

  // ⑧ 建画布（HiDPI：缓冲区按 dpr 放大，逻辑坐标仍是 CSS 像素）
  var canvas = document.createElement('canvas');
  canvas.className = 'wordcloud-canvas';
  function cloudHeight() {
    var headH = window.innerWidth <= 767 ? 100 : 72;
    return Math.max(560, window.innerHeight - headH - 48);
  }
  function setup(w, h) {
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    var c = canvas.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    return c;
  }

  var placedAll = [];
  try {
    var W = parent.clientWidth, H = cloudHeight();
    var ctx = setup(W, H);
    placedAll = layout(ctx, W, H) || [];
    if (!placedAll.length) throw new Error('empty layout');
    parent.insertBefore(canvas, oldBox);
    oldBox.hidden = true;   // 隐藏原云，保留 DOM 作降级 fallback

    // 暴露调试句柄
    window.__zzhWordcloud = { canvas: canvas, tags: tags, placed: placedAll };

    // 点击/悬停命中（矩形盒近似）
    function hitAt(ev) {
      var r = canvas.getBoundingClientRect();
      var x = ev.clientX - r.left, y = ev.clientY - r.top;
      for (var i = 0; i < placedAll.length; i++) {
        var p = placedAll[i].box;
        if (x >= p.x && x <= p.x + p.w && y >= p.y && y <= p.y + p.h) return placedAll[i].it.tag;
      }
      return null;
    }
    canvas.addEventListener('click', function (ev) {
      var t = hitAt(ev);
      if (t) window.location.href = '/zzh-notes/' + t.path;
    });
    canvas.addEventListener('mousemove', function (ev) {
      canvas.style.cursor = hitAt(ev) ? 'pointer' : 'default';
    });

    // resize 重绘（debounce 150ms），宽高按当前视口重算
    var rt;
    window.addEventListener('resize', function () {
      clearTimeout(rt);
      rt = setTimeout(function () {
        var w2 = parent.clientWidth, h2 = cloudHeight();
        var c2 = setup(w2, h2);
        var p2 = layout(c2, w2, h2);
        if (p2 && p2.length) placedAll = p2;
      }, 150);
    });
  } catch (err) {
    console.warn('[ZZH] 词云绘制异常，降级为默认标签云：', err);
    if (canvas.parentNode) canvas.remove();
    oldBox.hidden = false;   // 恢复原云
  }
})();</script></body></html>
