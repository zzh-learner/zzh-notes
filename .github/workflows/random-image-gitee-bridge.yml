name: Random image Gitee bridge

# 图池「云端换血」链的 GitHub 侧（夸克 API 屏蔽海外 IP，拉图只能在国内环境做）：
#   Gitee Go（国内构建机，每天北京时间 10:00）跑 tools/random-image-sync.mjs
#   → 从夸克抽 4 张新图、压缩、提交推送到 Gitee 桥接仓库
#   → 本 workflow（10:33）把图池变更拉回本仓库 main，并显式触发 deploy 发布
#   → 最后把本仓库当前图池状态镜像回 Gitee（种子 + 防两边漂移；本地手动同步的变更也借此对齐）。
#
# 依赖配置（缺任一则相关步骤安全跳过，workflow 不红）：
#   repo variable  GITEE_BRIDGE_REPO   如 yourname/zzh-notes-bridge
#   repo variable  GITEE_BRIDGE_USER   Gitee 用户名（镜像推送凭据用）
#   repo secret    GITEE_TOKEN         Gitee 私人令牌（勾选 projects 权限）
# 夸克鉴权只存在于 Gitee Go 流水线私有变量 QUARK_AUTH_CONFIG，本 workflow 不接触。
# 看门狗 random-image.yml 仍然兜底：整条链停摆超 7 天会开 issue 提醒。

on:
  schedule:
    - cron: '33 2 * * *'   # UTC 02:33 = 北京时间 10:33
  workflow_dispatch:

permissions:
  contents: write   # 拉回后提交 main
  actions: write    # GITHUB_TOKEN 的 push 不触发其他 workflow，需显式 dispatch deploy

concurrency:
  group: random-image-gitee-bridge
  cancel-in-progress: false

jobs:
  bridge:
    if: github.repository == 'zzh-learner/zzh-notes'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITEE_REPO: ${{ vars.GITEE_BRIDGE_REPO || 'NOT_SET' }}
      GITEE_USER: ${{ vars.GITEE_BRIDGE_USER || 'NOT_SET' }}
    steps:
      - uses: actions/checkout@v7

      - name: Clone Gitee bridge repo
        run: |
          if [ "$GITEE_REPO" = "NOT_SET" ]; then
            echo "未配置 repo variable GITEE_BRIDGE_REPO，跳过（见 README『随机一图·Gitee 桥接』）"
            exit 0
          fi
          rm -rf /tmp/gitee
          if git clone --depth 1 "https://gitee.com/${GITEE_REPO}.git" /tmp/gitee; then
            echo "clone_ok=true" >> "$GITHUB_ENV"
          else
            echo "克隆失败（仓库未建 / 名称不对 / 网络问题），本次跳过"
          fi

      - name: Apply pool updates from Gitee if newer
        if: env.clone_ok == 'true'
        run: |
          set -e
          gm=/tmp/gitee/source/random/manifest.json
          lm=source/random/manifest.json
          if [ ! -f "$gm" ]; then echo "Gitee 侧无 manifest（种子未完成），跳过拉回"; exit 0; fi
          newer=$(node -e '
            const fs=require("fs");
            const t=(f)=>{try{return Date.parse(JSON.parse(fs.readFileSync(f,"utf8")).updatedAt)||0}catch{return 0}};
            console.log(t(process.argv[1])>t(process.argv[2])?"yes":"no")' "$gm" "$lm")
          if [ "$newer" != "yes" ]; then echo "Gitee 侧不比本地新，跳过拉回"; exit 0; fi
          echo "Gitee 图池更新（updatedAt 更新），应用变更（含淘汰删除）"
          rsync -a --delete /tmp/gitee/source/random/ source/random/
          cp /tmp/gitee/tools/random-image-state.json tools/random-image-state.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/random tools/random-image-state.json
          if git diff --cached --quiet; then echo "无实际变更"; exit 0; fi
          git commit -m "chore(random-image): pool refresh via Gitee bridge"
          git push
          echo "applied=true" >> "$GITHUB_ENV"

      - name: Trigger deploy
        if: env.applied == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "Deploy Hexo to GitHub Pages.yml" --repo zzh-learner/zzh-notes --ref main

      - name: Mirror current pool state back to Gitee
        if: env.clone_ok == 'true'
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -e
          if [ -z "$GITEE_TOKEN" ]; then echo "未配置 secret GITEE_TOKEN，跳过镜像"; exit 0; fi
          if [ "$GITEE_USER" = "NOT_SET" ]; then echo "未配置 repo variable GITEE_BRIDGE_USER，跳过镜像"; exit 0; fi
          cd /tmp/gitee
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p source/random tools/gitee-bridge
          rsync -a --delete "$GITHUB_WORKSPACE/source/random/" source/random/
          cp "$GITHUB_WORKSPACE/tools/random-image-sync.mjs" tools/
          cp "$GITHUB_WORKSPACE/tools/random-image-state.json" tools/
          cp "$GITHUB_WORKSPACE/tools/gitee-bridge/"* tools/gitee-bridge/
          # 注意：不覆盖 .workflow/——Gitee 流水线文件以网页端编辑为准（任务=插件，语法以 UI 生成为准）
          git add -A
          if git diff --cached --quiet; then echo "镜像无变更"; exit 0; fi
          git commit -m "mirror: sync pool state from github main"
          git push "https://${GITEE_USER}:${GITEE_TOKEN}@gitee.com/${GITEE_REPO}.git" HEAD:master
          echo "镜像已推送到 Gitee"
