    return c;
  }

  var placedAll = [];
  try {
    var W = parent.clientWidth, H = cloudHeight();
    var ctx = setup(W, H);
    placedAll = layout(ctx, W, H) || [];
    if (!placedAll.length) throw new Error('empty layout');
    parent.insertBefore(canvas, oldBox);
    oldBox.hidden = true;   // 隐藏原云，保留 DOM 作降级 fallback

    // 暴露调试句柄
    window.__zzhWordcloud = { canvas: canvas, tags: tags, placed: placedAll };

    // 点击/悬停命中（矩形盒近似）
    function hitAt(ev) {
      var r = canvas.getBoundingClientRect();
      var x = ev.clientX - r.left, y = ev.clientY - r.top;
      for (var i = 0; i < placedAll.length; i++) {
        var p = placedAll[i].box;
        if (x >= p.x && x <= p.x + p.w && y >= p.y && y <= p.y + p.h) return placedAll[i].it.tag;
      }
      return null;
    }
    canvas.addEventListener('click', function (ev) {
      var t = hitAt(ev);
      if (t) window.location.href = '/zzh-notes/' + t.path;
    });
    canvas.addEventListener('mousemove', function (ev) {
      canvas.style.cursor = hitAt(ev) ? 'pointer' : 'default';
    });

    // resize 重绘（debounce 150ms），宽高按当前视口重算
    var rt;
    window.addEventListener('resize', function () {
      clearTimeout(rt);
      rt = setTimeout(function () {
        var w2 = parent.clientWidth, h2 = cloudHeight();
        var c2 = setup(w2, h2);
        var p2 = layout(c2, w2, h2);
        if (p2 && p2.length) placedAll = p2;
      }, 150);
    });
  } catch (err) {
    console.warn('[ZZH] 词云绘制异常，降级为默认标签云：', err);
    if (canvas.parentNode) canvas.remove();
    oldBox.hidden = false;   // 恢复原云
  }
})();</script></body></html>
