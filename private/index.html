      if (!s || s.v !== 1 || typeof s.k !== 'string' || !/^[0-9a-f]{64}$/.test(s.k) ||
          typeof s.e !== 'number' || s.e <= Date.now()) {
        localStorage.removeItem(PKEY_KEY);
        return null;
      }
      return s;
    } catch (e) { return null; }
  }

  function loggedIn() {
    try { return !!localStorage.getItem(AUTH_KEY); } catch (e) { return false; }
  }

  // 无权访问卡：未登录保留静态卡（含「前往登录」）；已登录但无权 → 改写文案并
  // 移除登录按钮。两种情况都绝不动任何 localStorage。
  function deny() {
    var title = document.getElementById('zzh-pgate-title');
    var desc = document.getElementById('zzh-pgate-desc');
    var btn = document.getElementById('zzh-pgate-btn');
    if (!gateEl) return;
    gateEl.classList.remove('is-loading'); // 若处于加载态（解密尝试中）则还原锁卡文案
    if (loggedIn()) {
      if (title) title.textContent = '无权访问';
      if (desc) desc.textContent = '本板块仅限管理员查看；当前登录账号没有私密板块权限。';
      if (btn && btn.parentNode) btn.parentNode.removeChild(btn);
    }
    if (errEl && loggedIn()) {
      errEl.textContent = '解密失败或缺少私密密钥；如你是管理员，请退出后用管理员账号重新登录。';
      errEl.hidden = false;
    }
  }

  var rebindDone = false;
  function rebind() {
    if (rebindDone) return;
    rebindDone = true;
    document.body.classList.add('zzh-decrypted');
    // 只做类标记；Redefine 的 'redefine:page:refresh' 派发刻意推迟到图片解密
    // 完成后（见 inject 的 done）——imageViewer 重建节点缓存时看到的是 blob 地址。
  }

  // 私密图片解密：src 落在 /private/ 下的 img 逐个取同名 .enc → JSON 容器 → 解密 →
  // blob URL 回填；父级是 <a>（照片墙卡片）时摘除其 href（放大走 imageViewer 的
  // img 级委托，锚留着只会把点击导航去已不存在的原图路由）。单个失败不打断整页，
  // 但会标记 data-zzh-pimg="fail"（可观测，不留纯静默黑洞）。
  // ⚠ payload/密文容器变量必须声明在 .then 链外的闭包里（每个 img 一个）——曾把
  // var payload 写进第 2 个回调、第 3 个回调引用 → ReferenceError 被空 catch 吞掉，
  // 全部图片静默不解（验收抓出的确定性 bug），勿再改回回调内声明。
  function decryptImages(scope) {
    var imgs = scope.querySelectorAll('img[src*="/private/"]');
    var tasks = [];
    // PKEY 全页同一把：CryptoKey 只 import 一次、各图共用（原先每图重复 import
    // 同一密钥）。惰性创建——本页没有待解图片时不白跑 readPkey/importKey。
    var keyPromise = null;
    function getKey() {
      if (!keyPromise) {
        keyPromise = Promise.resolve().then(function () {
          var pkey = readPkey();
          if (!pkey) throw new Error('no-pkey');
          return window.crypto.subtle.importKey('raw', hexToBytes(pkey.k), 'AES-GCM', false, ['decrypt']);
        });
      }
      return keyPromise;
    }
    Array.prototype.forEach.call(imgs, function (img) {
      var src = img.getAttribute('src') || '';
      if (!src || src.indexOf('.enc', src.length - 4) >= 0) return;
      var payload = null; // 容器 JSON：跨 .then 共享（链外声明，见上方 ⚠）
      tasks.push(fetch(src + '.enc').then(function (res) {
        if (!res.ok) throw new Error('http ' + res.status);
        return res.text();
      }).then(function (text) {
        payload = JSON.parse(text);
        if (!payload || payload.v !== 1 || typeof payload.iv !== 'string' || typeof payload.ct !== 'string') {
          throw new Error('bad container');
        }
        return getKey();
      }).then(function (key) {
        var subtle = window.crypto.subtle;
        return subtle.decrypt({ name: 'AES-GCM', iv: hexToBytes(payload.iv) }, key, b64ToBytes(payload.ct));
      }).then(function (plain) {
        var ext = src.split('.').pop().toLowerCase();
        var blob = new Blob([plain], { type: MIME[ext] || 'application/octet-stream' });
        // ⚠ 刻意不 revokeObjectURL：imageViewer 的放大取图走 img 当前 src（blob
        // 地址），img load 后 revoke 等于废掉点击放大，URL 必须与页面同寿
        // （与「blob 从不 revoke」的直觉相反，勿改成 load/error 后回收）。
        var url = URL.createObjectURL(blob);
        img.src = url;
        // 照片墙卡片的 <a> 锚（构建期 private-hub.js 生成的卡片标记）摘除 href：
        // Redefine 的点击放大是 document 级委托、作用在 <img> 上，锚不再承担放大；
        // 而锚的原始 href 指向产物里已不存在的 /private/ 原图路由（构建期已改
        // .enc 并移除原路由），保留 = 点击时浏览器导航去 404。摘 href 后点击仍会
        // 冒泡进 imageViewer 的委托处理器，放大链路不受影响。
        var a = img.closest ? img.closest('a') : null;
        if (a) { try { a.removeAttribute('href'); } catch (e) {} }
      }).catch(function () {
        // 单图失败保持 alt 展示，不打断整页；留失败标记供排查/测试断言
        try { img.setAttribute('data-zzh-pimg', 'fail'); } catch (e) {}
      }));
    });
    return Promise.all(tasks);
  }

  function inject(plainHtml) {
    if (!gateEl || !gateEl.parentNode) return;
    var tpl = document.createElement('template');
    tpl.innerHTML = plainHtml; // template 内容惰性，<script> 解析后不执行
    var scripts = Array.prototype.slice.call(tpl.content.querySelectorAll('script'));
    // 顶层元素标记 data-zzh-injected：source/css/zzh.css 据此做整体淡入
    var roots = [];
    for (var r = 0; r < tpl.content.childNodes.length; r++) {
      if (tpl.content.childNodes[r].nodeType === 1) roots.push(tpl.content.childNodes[r]);
    }
    for (var m = 0; m < roots.length; m++) roots[m].setAttribute('data-zzh-injected', '');
    gateEl.parentNode.replaceChild(tpl.content, gateEl);
    for (var i = 0; i < scripts.length; i++) {
      var old = scripts[i];
      var s = document.createElement('script');
      for (var j = 0; j < old.attributes.length; j++) {
        s.setAttribute(old.attributes[j].name, old.attributes[j].value);
      }
      s.text = old.text;
      if (old.parentNode) old.parentNode.replaceChild(s, old);
    }
    if (dataEl && dataEl.parentNode) dataEl.parentNode.removeChild(dataEl);
    rebind();
    // 先解图片、后派发 Redefine 的 'redefine:page:refresh'：main.js 重跑 initPage
    // 时 imageViewer 收集到的图片节点已是 blob 地址；图片链路整体失败也要派发
    // （文字内容照常显示，imageViewer 的点击委托本就无需重建）
    decryptImages(document).then(done, done);
    function done() {
      try { window.dispatchEvent(new Event('redefine:page:refresh')); } catch (e) {}
    }
  }

  // 跨标签页：另一标签登录/登出（zzh-pkey 变化）后本标签刷新到正确状态
  window.addEventListener('storage', function (ev) {
    if (ev && ev.key === PKEY_KEY) location.reload();
  });

  // —— 早启动：解析期即开跑（与全局脚本同构：解密是纯计算，不等 DOMContentLoaded；
  // PKEY 有效即切加载态，失败路径 deny() 移除 is-loading 还原锁卡）——
  var subtle = window.crypto && window.crypto.subtle;
  var pkey = readPkey();
  var payload = null;
  try { payload = JSON.parse(dataEl.textContent); } catch (e) { payload = null; }
  var payloadOk = !!payload && payload.v === 1 && typeof payload.iv === 'string' && typeof payload.ct === 'string';
  function startCipher() {
    return subtle.importKey('raw', hexToBytes(pkey.k), 'AES-GCM', false, ['decrypt']).then(function (key) {
      return subtle.decrypt({ name: 'AES-GCM', iv: hexToBytes(payload.iv) }, key, b64ToBytes(payload.ct));
    });
  }
  var cipherPromise = null;
  if (subtle && pkey && payloadOk) {
    if (gateEl) gateEl.classList.add('is-loading');
    cipherPromise = startCipher();
  }

  whenReady(function () {
    if (!subtle) {
      if (errEl) { errEl.textContent = '当前环境不支持解密（需 HTTPS 或 localhost 访问）'; errEl.hidden = false; }
      return;
    }
    if (!pkey) { deny(); return; }
    if (!payloadOk) { deny(); return; }
    if (!cipherPromise) cipherPromise = startCipher(); // 兜底：正常在解析期已启动
    cipherPromise.then(function (plain) {
      inject(new TextDecoder().decode(plain));
    }).catch(function () {
      // ⚠ 刻意不清 localStorage：全局会话与私钥互不连坐（与全局脚本相反），只提示
      deny();
    });
  });
})();</script></div><div class="page-template-comments"></div></div><div class="paginator"></div></div></div><div class="main-content-footer"><footer class="footer mt-5 py-5 h-auto text-base text-third-text-color relative border-t-2 border-t-border-color"><div class="info-container py-3 text-center"><div class="text-center">&copy; <span>2022</span> - 2026&nbsp;&nbsp;<i class="fa-solid fa-heart fa-beat" style="--fa-animation-duration: 0.5s; color: #f54545"></i>&nbsp;&nbsp;<a href="/zzh-notes/">ZZH</a></div><div class="relative text-center lg:absolute lg:left-[20px] lg:top-1/2 lg:-translate-y-1/2 lg:text-left"><span class="lg:block text-sm">由 <?xml version="1.0" encoding="utf-8"?><!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd"><svg class="relative top-[2px] inline-block align-baseline" version="1.1" id="圖層_1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px" width="1rem" height="1rem" viewBox="0 0 512 512" enable-background="new 0 0 512 512" xml:space="preserve"><path fill="#0E83CD" d="M256.4,25.8l-200,115.5L56,371.5l199.6,114.7l200-115.5l0.4-230.2L256.4,25.8z M349,354.6l-18.4,10.7l-18.6-11V275H200v79.6l-18.4,10.7l-18.6-11v-197l18.5-10.6l18.5,10.8V237h112v-79.6l18.5-10.6l18.5,10.8V354.6z"/></svg><a target="_blank" class="text-base" href="https://hexo.io">Hexo</a> 驱动</span> <span class="text-sm lg:block">主题&nbsp;<a class="text-base" target="_blank" href="https://github.com/EvanNotFound/hexo-theme-redefine">Redefine v2.9.0</a></span></div><div class="zzh-account-dock" id="zzh-account-dock"><a href="/zzh-notes/login/">登录</a> <a href="/zzh-notes/private/" id="zzh-private-nav" hidden>私密</a> <span class="zzh-auth-chip" id="zzh-auth-chip" hidden><a class="zzh-auth-chip-link" href="/zzh-notes/login/"><span class="zzh-auth-chip-badge" aria-hidden="true">管</span><span class="zzh-auth-chip-name"></span> </a><button type="button" class="zzh-auth-chip-logout" id="zzh-auth-chip-logout" ari
