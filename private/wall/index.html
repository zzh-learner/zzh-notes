="zzh-auth-chip-logout" aria-label="登出" title="登出">✕</button> </span><button type="button" class="custom-header-search popup-trigger" aria-label="搜索" title="搜索"><i class="fa fa-search" aria-hidden="true"></i></button></div></div></header><script>(function () {
  'use strict';
  var KEY = 'zzh-auth';
  window.ZzhAuth = {
    read: function () {
      try {
        var raw = localStorage.getItem(KEY);
        if (!raw) return null;
        var s = JSON.parse(raw);
        if (!s || typeof s.u !== 'string' ||
            (s.r !== 'admin' && s.r !== 'user') ||
            typeof s.e !== 'number' || s.e <= Date.now()) {
          localStorage.removeItem(KEY);
          localStorage.removeItem('zzh-gh-token'); // 会话过期即清写作台令牌（登出/过期同清，与 logout() 同步）
          return null;
        }
        return s;
      } catch (e) { return null; }
    },
    logout: function () {
      // 登出四键同清：'zzh-cek'（内容密钥）、'zzh-pkey'（私密板块密钥，仅 admin）、
      // 'zzh-gh-token'（写作台访问令牌，仅 admin）与 'zzh-auth'（登录态）同生共死。
      // 同步副本：scripts/login-page.js 的 logout()（含写作台键）与 scripts/zzh-post-cipher.js
      // 注入脚本的 GCM 失败清理——三处改一处必须同步其余（会话多键 + 私钥约定）。
      try {
        localStorage.removeItem(KEY);
        localStorage.removeItem('zzh-cek');
        localStorage.removeItem('zzh-pkey');
        localStorage.removeItem('zzh-gh-token');
      } catch (e) {}
      location.reload();
    }
  };
  var s = window.ZzhAuth.read();
  var chip = document.getElementById('zzh-auth-chip');
  if (s && chip) {
    chip.hidden = false;
    var name = chip.querySelector('.zzh-auth-chip-name');
    if (name) name.textContent = s.u;
    if (s.r === 'admin') chip.classList.add('is-admin');
  }
  // 私密板块入口：仅 admin 会话显示（登出 logout() reload 后本脚本重跑即隐藏）
  var priv = document.getElementById('zzh-private-nav');
  if (priv) priv.hidden = !(s && s.r === 'admin');
  var btn = document.getElementById('zzh-auth-chip-logout');
  if (btn) {
    btn.addEventListener('click', function (e) {
      e.preventDefault();
      window.ZzhAuth.logout();
    });
  }
})();</script></header></div><div class="main-inner page posts-expand"><div class="post-block" lang="zh-CN"><div class="post-body"><div class="zzh-gate" id="zzh-pgate"><div class="zzh-gate-card"><span class="zzh-gate-icon" aria-hidden="true"><i class="fa fa-lock"></i></span><p class="zzh-gate-title" id="zzh-pgate-title">本板块仅限管理员查看</p><p class="zzh-gate-desc" id="zzh-pgate-desc">请使用管理员账号登录后访问。</p><p class="zzh-gate-load" role="status"><span class="zzh-gate-spin" aria-hidden="true"></span>正在解密内容…</p><a class="zzh-gate-btn" id="zzh-pgate-btn" href="/zzh-notes/login/">前往登录</a><p class="zzh-gate-err" id="zzh-pgate-err" hidden></p></div></div><script type="application/json" id="zzh-pcipher-data">{"v":1,"alg":"AES-256-GCM","iv":"03645c992bf0187b45429e87","ct":"v0yMWV7rdQBMeQxUFmMoBuPa3IA1/aNLS0Stklpq/fof0kh/CD+m42Z014Y/dSlRE5D4+zcAfl7ZVGfZXGzgxY5ygt3Ksez8Rap5lEy9sgp+TT/2DS+gtD7TyFKbibMmBzlatAAvgTtIkx9ld//WqF+y3RjyYQFsFa2XGQE97YPq6LFu/Vkei8uLKnkKHo7G+DPIanyNAA8EHIig2Zgajza65mt8uGmBwy7d8U6ooLZnTwwfEmtocC90F2uwCJESngxj6JHZkArsrcnVFbA34qq5Wh9Bz/PvbOB4Hu3e7hcfVgCul84K7mJ7IsnL2youqKAj9+exnadh4skDd+YR/XtXHVW49aDPkBomsyGFJsVHtwVKwWhm6GZfFoz/o3ASgIAJ2A/joWxd1keJLqJW5wzWBYCap+dwIzdDBjtlQjoWbPBCKdTS2WMH75TMFlRKNU3xwxCIf7+5ZoN8TrfFXCSdU/ktKlYL/o/t2csxX0h/jHweeZX+6WBJjwrQ4xVRXrP51F4VE1o6S8SRHauhMj5dldTAY16jmRKWMszMv0IdhES1lriphqU/eyWI0ZufdYiRNAJ/lI802HKQCEaXqJX3JAI1TNltIOO5btWxIAceD3x0vegJ3sA8HvuQL+/mvIPmUQh43dibyjG/vNBxP7yPILlWo0JVNT7rHSub5X52QvtJ5kZroXSp8cJNiBMOm/zp6a18gGESYf343slNyP2amMY8QRuZrKf7gwwDg7DaQXP6DVkaMe2ZPe+zuvljcHcRLgHhmosSy87/pyc7gW12hYnECJp2wEjEPud0iXL/T9p04l3Nclu7FEcxHIAkKvGuYWxu9+dbJnAgdLzBbo+zh6aop71zy3UDxdlmxemMbwaYQpWh+LbsBo5hV9tD8ZuKaE2sMaFolBkdluZyEpWvrmAri4KPhTluhK4ndTi89GiI6VZdeX9ii30aUzO6o1ljBL1tOK4fiyPIH46tEhp6zFviaYNUSjg1O31pfSPU49R791glImN2prpChmm7tegY/p6AWotxqqZ405TLG9eVfCOzKfLkjtbK6Kg6UpnXSm2NZzLDxPI54kudA91C8pC3QYuRxl0v2gyacDLpk7JF85OOyvVx2rKqphsTkxEC6f2Sy+Jn6jsi2KjKGGXMNTJU7+yda4yiIaFzuptDwGFcY1rzqXdkJoiEX0d875FcQ8q4d+6Dw3/rWj6IwqInZb9tAdgjIM+2IdIU4kFR
