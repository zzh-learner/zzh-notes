="zzh-auth-chip-logout" aria-label="登出" title="登出">✕</button> </span><button type="button" class="custom-header-search popup-trigger" aria-label="搜索" title="搜索"><i class="fa fa-search" aria-hidden="true"></i></button></div></div></header><script>(function () {
  'use strict';
  var KEY = 'zzh-auth';
  window.ZzhAuth = {
    read: function () {
      try {
        var raw = localStorage.getItem(KEY);
        if (!raw) return null;
        var s = JSON.parse(raw);
        if (!s || typeof s.u !== 'string' ||
            (s.r !== 'admin' && s.r !== 'user') ||
            typeof s.e !== 'number' || s.e <= Date.now()) {
          localStorage.removeItem(KEY);
          localStorage.removeItem('zzh-gh-token'); // 会话过期即清写作台令牌（登出/过期同清，与 logout() 同步）
          return null;
        }
        return s;
      } catch (e) { return null; }
    },
    logout: function () {
      // 登出四键同清：'zzh-cek'（内容密钥）、'zzh-pkey'（私密板块密钥，仅 admin）、
      // 'zzh-gh-token'（写作台访问令牌，仅 admin）与 'zzh-auth'（登录态）同生共死。
      // 同步副本：scripts/login-page.js 的 logout()（含写作台键）与 scripts/zzh-post-cipher.js
      // 注入脚本的 GCM 失败清理——三处改一处必须同步其余（会话多键 + 私钥约定）。
      try {
        localStorage.removeItem(KEY);
        localStorage.removeItem('zzh-cek');
        localStorage.removeItem('zzh-pkey');
        localStorage.removeItem('zzh-gh-token');
      } catch (e) {}
      location.reload();
    }
  };
  var s = window.ZzhAuth.read();
  var chip = document.getElementById('zzh-auth-chip');
  if (s && chip) {
    chip.hidden = false;
    var name = chip.querySelector('.zzh-auth-chip-name');
    if (name) name.textContent = s.u;
    if (s.r === 'admin') chip.classList.add('is-admin');
  }
  // 私密板块入口：仅 admin 会话显示（登出 logout() reload 后本脚本重跑即隐藏）
  var priv = document.getElementById('zzh-private-nav');
  if (priv) priv.hidden = !(s && s.r === 'admin');
  var btn = document.getElementById('zzh-auth-chip-logout');
  if (btn) {
    btn.addEventListener('click', function (e) {
      e.preventDefault();
      window.ZzhAuth.logout();
    });
  }
})();</script></header></div><div class="main-inner page posts-expand"><div class="post-block" lang="zh-CN"><div class="post-body"><div class="zzh-gate" id="zzh-pgate"><div class="zzh-gate-card"><span class="zzh-gate-icon" aria-hidden="true"><i class="fa fa-lock"></i></span><p class="zzh-gate-title" id="zzh-pgate-title">本板块仅限管理员查看</p><p class="zzh-gate-desc" id="zzh-pgate-desc">请使用管理员账号登录后访问。</p><p class="zzh-gate-load" role="status"><span class="zzh-gate-spin" aria-hidden="true"></span>正在解密内容…</p><a class="zzh-gate-btn" id="zzh-pgate-btn" href="/zzh-notes/login/">前往登录</a><p class="zzh-gate-err" id="zzh-pgate-err" hidden></p></div></div><script type="application/json" id="zzh-pcipher-data">{"v":1,"alg":"AES-256-GCM","iv":"730250a101ef4836211d98f4","ct":"VWBoX/MxqognwaKF4UNj8bJv7tmE8NP30Kos72/n1UPiJGBwN4akNYZzM58Rk3HkjndS+LFicIzqycWIjFvr4qljmSZ7ybfAlc6Nr/M5kllx5rxh0ozXQ5F5x2ITWmxf3UafssnY5Yc/GtpAu4pBzI1ZxL+D3dHtPVmPqFq886o0jPkJeWH7QCcnCYqOOQED0wzZNo7TniBflFmjZ3JRuchgJ+aVBqegpFxY/r4m8BlMU+4+p2EiL1GFRDlpeL/Sp3gU1Sz73Vn+el7IG8GA5gap3CvR6u4fO8vwzRdzPKtGXihrBlNWyaYzPYChl4zmszP3+QKVgDSsIck9pMGeOnS1WHioHeQ+aVA96GMSqeIYHikCqOohOJTDEPDcvCCsjg7ttgmhJYlA4smJnWclnXbOVoMV45AIU7hGaayTl4NZghs0mSHtptzNHXnQP+FKLdArHbdGJUYAhbyMHxQgyBPFey1nW1I15fRqtzvYgyRlGTRDhc5JfuTitbX0yp3dIWuYphquqVZpJxf9OTaU9s/YjuGDWrw5oK3xpVQa2RmXAp1mBYfH7slBnCSmuJ2e//UsYyrRTlRf3N5tgF4lkxfVsVL4loxkZs2aqZxxf2JykHjTtXXxwfurV5gyHDBbXh7N/Qtjvon/j/EeArBF2ZMKts8WJJWsPONjeYy8WrehAlbEeeGDWNpoQLiEyS8THSWOkWI3HI7w8Ajx3Qa0IDS5+mZTTmWAYk9xyj0upW18xwZ0rXmrgAlIGL4HPtaQfDvkiB78cTfVQzD55zCDScuDfFCtVekbgIvKeelDhqax3AEWkL9eDa1RLULgKV77oW9qRACRcYyX6qYORGKugwKxXJgGKDgPLLym/ZxXbOreja34M/I9aYF1o/+6j1/0FJ5cyjpLVVNcFAYOXwOhulGmMt/EWePkh16bSSHyf0ILXkz8ofFwF5tbXqwh7mApNMyXfuPOb1vjf+vP4EuNaL5H9TEX3tk2SuSRTkgGtB0JdaGb/7Iw9oLbUyrdoD46p683XlVTNPnEPsk/oDIa9RPnnAEkyrUIzUReKnzaW/c4cvIBt6K6WfLhMrzndlcojHIqbBruM1NMQm55e6DOwQqAeE95tk3P7ZS0ECrdXo0dd8IERKByiM2CikZMCTypXgLxUh27YzUoxbBqRFvjYpyWmplfBcsKBzfZNlFrH+2dy3M+XppQeiqDoJpKkha3B/bQSPnLjRYTOrHEpU/2
