t" id="zzh-auth-chip-logout" aria-label="登出" title="登出">✕</button> </span><button type="button" class="custom-header-search popup-trigger" aria-label="搜索" title="搜索"><i class="fa fa-search" aria-hidden="true"></i></button></div></div></header><script>(function () {
  'use strict';
  var KEY = 'zzh-auth';
  window.ZzhAuth = {
    read: function () {
      try {
        var raw = localStorage.getItem(KEY);
        if (!raw) return null;
        var s = JSON.parse(raw);
        if (!s || typeof s.u !== 'string' ||
            (s.r !== 'admin' && s.r !== 'user') ||
            typeof s.e !== 'number' || s.e <= Date.now()) {
          localStorage.removeItem(KEY);
          localStorage.removeItem('zzh-gh-token'); // 会话过期即清写作台令牌（登出/过期同清，与 logout() 同步）
          return null;
        }
        return s;
      } catch (e) { return null; }
    },
    logout: function () {
      // 登出四键同清：'zzh-cek'（内容密钥）、'zzh-pkey'（私密板块密钥，仅 admin）、
      // 'zzh-gh-token'（写作台访问令牌，仅 admin）与 'zzh-auth'（登录态）同生共死。
      // 同步副本：scripts/login-page.js 的 logout()（含写作台键）与 scripts/zzh-post-cipher.js
      // 注入脚本的 GCM 失败清理——三处改一处必须同步其余（会话多键 + 私钥约定）。
      try {
        localStorage.removeItem(KEY);
        localStorage.removeItem('zzh-cek');
        localStorage.removeItem('zzh-pkey');
        localStorage.removeItem('zzh-gh-token');
      } catch (e) {}
      location.reload();
    }
  };
  var s = window.ZzhAuth.read();
  var chip = document.getElementById('zzh-auth-chip');
  if (s && chip) {
    chip.hidden = false;
    var name = chip.querySelector('.zzh-auth-chip-name');
    if (name) name.textContent = s.u;
    if (s.r === 'admin') chip.classList.add('is-admin');
  }
  // 私密板块入口：仅 admin 会话显示（登出 logout() reload 后本脚本重跑即隐藏）
  var priv = document.getElementById('zzh-private-nav');
  if (priv) priv.hidden = !(s && s.r === 'admin');
  var btn = document.getElementById('zzh-auth-chip-logout');
  if (btn) {
    btn.addEventListener('click', function (e) {
      e.preventDefault();
      window.ZzhAuth.logout();
    });
  }
})();</script></header></div><div class="main-inner page posts-expand"><div class="post-block" lang="zh-CN"><div class="post-body"><div class="zzh-gate" id="zzh-pgate"><div class="zzh-gate-card"><span class="zzh-gate-icon" aria-hidden="true"><i class="fa fa-lock"></i></span><p class="zzh-gate-title" id="zzh-pgate-title">本板块仅限管理员查看</p><p class="zzh-gate-desc" id="zzh-pgate-desc">请使用管理员账号登录后访问。</p><p class="zzh-gate-load" role="status"><span class="zzh-gate-spin" aria-hidden="true"></span>正在解密内容…</p><a class="zzh-gate-btn" id="zzh-pgate-btn" href="/zzh-notes/login/">前往登录</a><p class="zzh-gate-err" id="zzh-pgate-err" hidden></p></div></div><script type="application/json" id="zzh-pcipher-data">{"v":1,"alg":"AES-256-GCM","iv":"aff93b7c856c9dfb73e72cb8","ct":"pMLr29/Ro354Dcl0fFHnVMBVcn33DPzlo9ilE2lXHfqrmXLtgniUIU5IMBbqITVGyj3IzeC/m1QG5pX61uW23XXqVJetJ8ZIbLQ4onifL5iEprTszwMCeXVeRqwE5qpaU7CgT7WRGFkftgljJH6UsQ3Xu4xDpBhBUCsm5PONakUSxQW0Xs2t+cfhEmN1gnCsAWaqGLhfYbq6ystBQvGZrrHPswk91HX9WqOQONFoOsukeQioHJksxjYq/1mgrTgFfnQTpmU0U4Pb/+ydbfvG2gaoERkndn+bUiOko1MPF1Q2OXE5fhTez5fg9hx1aC1+MkavUUG2TchVwC7bxBIdjoTmtIYk7ISlZMlAUR1G2e3z6TzAKR4kT4R0lABlYHE3W7ioHnUBuao/t7oZncngkkJay/vHzwRb1kl5oaXQYt7CXRS5gpXoMXmsUFyFyyzwCETtksiDYbSncfLwtOnrSKQSAnSCjlsFt0HRlF+QvxbbsOfJObNaRaQM7mYuJXh3LAWYIt8wsGAZnfC6PwdjfbyAlHO6boe/rMSGCLYvpZMDj7+JmYDEWZVNwp2QZ/Jz3WAnJucBj6q8pZHwXr9z4yOC1RP1QWUWVjh+Ag5WF1Ew9tmyDVScVkYqWn4NcCHZNGgpP3UZBk9IxY4qh6OXUOa+6Kg7wz4TDX6g8ofAxjozlymSXwc6yj4eN2a/GQqZFB2Fi2ZHBObNirtRwH5Kp9Tglri5rlp18akxwXTiJoPw4wcCGtGAe3xrSCJkjer5zL5AlbfsM20OduWRnNWlSjmn41n8/eTffTaFEWm11a8fRMhtLResdmAlSJBOjsWs8ahGK7aRbQQajdgCzqIXF1z6yvVEO7NInvFNDLSRaHaQtpFE5CQo0c5kJQcVtMzidCfKGTYVcPrL3vnM1gAYE6d3Z4Tmrboz3LriU062XyTddndaaFRnlU36/HFABalSWMoFDFkRZL6lMTYxBWRpoTzhxLoCg6PPg3x7Qk4MSL1P6kQ1ZaxRuTvSfmbDN7mNdtNHHqMSTpAw7fqjOd/w/iBscV1h7Vxwu9+fyR0fMXct3e33VkBHmE4NQ1YL3eD3/zYQer3A9xlXTTZgkdvijgsEP9HUqXvtepClOY3RxYS7W8rLnMU8mMRdEW/WTV8GVX+OQbTi466x4ZuRbo74f4xwt2ABxnHHcpOUVTkMoq7Ny3c+k7QC3gMPY0eILn5W+mK3TLPcxegzc8wlTPfD   }

  function b64ToBytes(b64) {
