t" id="zzh-auth-chip-logout" aria-label="登出" title="登出">✕</button> </span><button type="button" class="custom-header-search popup-trigger" aria-label="搜索" title="搜索"><i class="fa fa-search" aria-hidden="true"></i></button></div></div></header><script>(function () {
  'use strict';
  var KEY = 'zzh-auth';
  window.ZzhAuth = {
    read: function () {
      try {
        var raw = localStorage.getItem(KEY);
        if (!raw) return null;
        var s = JSON.parse(raw);
        if (!s || typeof s.u !== 'string' ||
            (s.r !== 'admin' && s.r !== 'user') ||
            typeof s.e !== 'number' || s.e <= Date.now()) {
          localStorage.removeItem(KEY);
          localStorage.removeItem('zzh-gh-token'); // 会话过期即清写作台令牌（登出/过期同清，与 logout() 同步）
          return null;
        }
        return s;
      } catch (e) { return null; }
    },
    logout: function () {
      // 登出四键同清：'zzh-cek'（内容密钥）、'zzh-pkey'（私密板块密钥，仅 admin）、
      // 'zzh-gh-token'（写作台访问令牌，仅 admin）与 'zzh-auth'（登录态）同生共死。
      // 同步副本：scripts/login-page.js 的 logout()（含写作台键）与 scripts/zzh-post-cipher.js
      // 注入脚本的 GCM 失败清理——三处改一处必须同步其余（会话多键 + 私钥约定）。
      try {
        localStorage.removeItem(KEY);
        localStorage.removeItem('zzh-cek');
        localStorage.removeItem('zzh-pkey');
        localStorage.removeItem('zzh-gh-token');
      } catch (e) {}
      location.reload();
    }
  };
  var s = window.ZzhAuth.read();
  var chip = document.getElementById('zzh-auth-chip');
  if (s && chip) {
    chip.hidden = false;
    var name = chip.querySelector('.zzh-auth-chip-name');
    if (name) name.textContent = s.u;
    if (s.r === 'admin') chip.classList.add('is-admin');
  }
  // 私密板块入口：仅 admin 会话显示（登出 logout() reload 后本脚本重跑即隐藏）
  var priv = document.getElementById('zzh-private-nav');
  if (priv) priv.hidden = !(s && s.r === 'admin');
  var btn = document.getElementById('zzh-auth-chip-logout');
  if (btn) {
    btn.addEventListener('click', function (e) {
      e.preventDefault();
      window.ZzhAuth.logout();
    });
  }
})();</script></header></div><div class="main-inner page posts-expand"><div class="post-block" lang="zh-CN"><div class="post-body"><div class="zzh-gate" id="zzh-pgate"><div class="zzh-gate-card"><span class="zzh-gate-icon" aria-hidden="true"><i class="fa fa-lock"></i></span><p class="zzh-gate-title" id="zzh-pgate-title">本板块仅限管理员查看</p><p class="zzh-gate-desc" id="zzh-pgate-desc">请使用管理员账号登录后访问。</p><p class="zzh-gate-load" role="status"><span class="zzh-gate-spin" aria-hidden="true"></span>正在解密内容…</p><a class="zzh-gate-btn" id="zzh-pgate-btn" href="/zzh-notes/login/">前往登录</a><p class="zzh-gate-err" id="zzh-pgate-err" hidden></p></div></div><script type="application/json" id="zzh-pcipher-data">{"v":1,"alg":"AES-256-GCM","iv":"9a8311a442d37ae9572dcad1","ct":"BsqlDJdiq9Yl94LWpVHAETf0Uq078z4DPIUJPbn/kUVWM/PjRdsmqtJMHRp57BJKQMin8FrcRXd7lsmwGVcQicGhk1nKkdURzPCd5aNCEF/JSuEzt+AcwExVt/ueKNIBQBJoH8YHvWBad38yofsOJp+/Z1qxO9ZegEfYbVoclMqdOnMh89SiORGrqKjzMh7dmul/xXCiIdwfpLLwnwq06KIv2AG8LppDSGo2gKYRNDNx/VCU3BIv/jBZGY6WcBjpFXv1488+QpS+M3LCZvSK1IMOjxE410UBzMmAzPf1Q26NZTOoTFnoDLNnrOI1QBP7dyuWDVTSPaE2qaKYVhvFD4wLArhsNIiK45j6am8SYTplNZ4bym/26Mqv5M7+mm3qyD2R7kbbdiPByyygZZMv8fwfISd9qjSm9C8EkDNwx9ep2tri8ZG9LFK2ZlpYWxMAnz5aniLuhlYZFedrNwPGL26UWvaD7ZD3Wtdcgi67GdTe6qna2QR0eiybHxN3OxmOeSzecT90DAozW3fwh/f2ET/lwa0UTKTWKBkSUz6X+fMu6gm+oykgcQK4vV5hJUIgifI70JUM0A3p1FyhqLAIJ2l9KIzgLF/Aey96Kkk88wz7RdLq7YA3mUZQ2TxXXNyjxlID4LhU/oEcYvaJkt9uWOfV0WqyxfEdrjEqFLT2MzJ3uyHoznVyqQ/W7zM/wxtW1V9I8/m6BNMOM4GUjMA70BgpZ2EZRae2P28o1ukgYov8hKJhCkZJLNz76RnPesiiqhlBB6CzivopGagRsdSfOscx+rHH2XmI8PY0cxBxX+nRr4h2nd+79OuYsfrRKTUYGWwBJ5leNGnGlT9HihBiKd+mwYC3P3ygzzAvEOw2IudMfl0euGKpQD3ecD+D8IqZWmpkqYb4rqSu/vpRBO5kg+eI2TNv2Nr6dAsVlRAo0GwbdCWtno39Sn0sLFhqETGhP1yPKBM26djdFomTaKmnJldvuoyHHqdzmdFGHGXFFXcE3+FDA7WknkWRaFknMdiHI+et+yPUk1MxEdEFdLjYM6T60HwZkvoyjIfR2iFXGrRMMNUs0Uqurk8setX0DUl2YwgZDSkm9eU00evvWUVVknkFD0jizx+IxsOYdrUBpEhERIjtPrk15F1jeJT0yvqcb76aP0prrOg8BvaPIbAcbEuNGg5ZWH0c1RcWsfA2PS+BuNDftOwLLS+1elXaaeKTrmaNvdKedxKhfGE6uxnq   function hexToBytes(hex) {

    for (var i = 0; i < out.length; i++) out[i] = parseInt(hex.substr(i * 2, 2), 16);

  }

  function b64ToBytes(b64) {
