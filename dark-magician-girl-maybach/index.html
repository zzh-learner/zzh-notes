  // 但"GSAP 加载成功后我的代码崩了"会导致内容永久 opacity:0，需要额外兜底。
  function revealAllFadeUp() {
    document.querySelectorAll('.fade-up').forEach(function (el) {
      el.style.opacity = '1';
      el.style.transform = 'none';
    });
    document.querySelectorAll('.post-body img').forEach(function (img) {
      img.style.opacity = '1';
    });
  }

  gsap.registerPlugin(ScrollTrigger);

  document.documentElement.classList.add('gsap-ready');

  try {

    var bar = document.querySelector('.reading-progress-bar');

    var allCards = document.querySelectorAll('.posts-expand .post-block');

    var allHeadings = document.querySelectorAll('.post-body h2, .post-body h3');

  }
  function rand(n) { return Math.floor(Math.random() * n); }

  // ⑥ 布局条目：洗牌后按字号降序（大词先随机占位、小词补空），25% 概率小角度旋转
  var items = tags.map(function (t) {
    return { tag: t, rot: Math.random() < 0.25 ? (Math.random() * 30 - 15) * Math.PI / 180 : 0 };
  });
  items.sort(function () { return Math.random() - 0.5; });
  items.sort(function (a, b) { return fontOf(b.tag, 1) - fontOf(a.tag, 1); });

  // 单轮放置：在画布上随机找无碰撞位置逐词绘制，返回放下的词条（矩形命中盒）
  function attempt(ctx, W, H, scale) {
    var rects = [];
    var placed = [];
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      var fs = fontOf(it.tag, scale);
      ctx.font = (fs >= 40 ? '600 ' : '400 ') + fs + 'px ' + FONT;
      var tw = ctx.measureText(it.tag.name).width;
      var th = fs * 1.15;
      // 旋转词用外接矩形近似（保守放大，含 GAP）
      var bw = Math.ceil(tw * Math.abs(Math.cos(it.rot)) + th * Math.abs(Math.sin(it.rot))) + GAP;
      var bh = Math.ceil(tw * Math.abs(Math.sin(it.rot)) + th * Math.abs(Math.cos(it.rot))) + GAP;
      var hit = null;
      for (var tr = 0; tr < 70 && hit === null; tr++) {
        var x = MARGIN + rand(Math.max(1, W - bw - MARGIN * 2));
        var y = MARGIN + rand(Math.max(1, H - bh - MARGIN * 2));
        var clash = false;
        for (var r = 0; r < rects.length; r++) {
          var q = rects[r];
          if (x < q.x + q.w && x + bw > q.x && y < q.y + q.h && y + bh > q.y) { clash = true; break; }
        }
        if (!clash) hit = { x: x, y: y, w: bw, h: bh };
      }
      if (hit) {
        rects.push(hit);
        placed.push({ it: it, box: hit });
        ctx.save();
        ctx.translate(hit.x + bw / 2, hit.y + bh / 2);
        ctx.rotate(it.rot);
        ctx.fillStyle = PALETTE[rand(PALETTE.length)];
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(it.tag.name, 0, 0);
        ctx.restore();
      }
    }
    return placed;
  }

  // 覆盖率（放置盒面积和 / 画布面积），用于「放得下但不饱满 → 放大字号重试」
  function coverageOf(placed, W, H) {
    var a = 0;
    for (var i = 0; i < placed.length; i++) a += placed[i].box.w * placed[i].box.h;
    return a / (W * H);
  }

  // ⑦ 自适应铺满：放不下(<90%) → 缩小 15%；放得下但不饱满(<30%) → 放大 15% 重试
  function layout(ctx, W, H) {
    var scale = 1, bestScale = 0, bestPlaced = null, lastOk = false;
    for (var round = 0; round < 6; round++) {
      var placed = attempt(ctx, W, H, scale);
      if (placed.length >= items.length * 0.9) {
        bestScale = scale; bestPlaced = placed; lastOk = true;
        if (coverageOf(placed, W, H) >= 0.3 || scale > 2.2) break;
        scale *= 1.15;
      } else {
        lastOk = false;
        scale *= 0.85;
        if (bestPlaced) break;
      }
    }
    if (bestPlaced && !lastOk) bestPlaced = attempt(ctx, W, H, bestScale);
    return bestPlaced;
  }

  // ⑧ 建画布（HiDPI：缓冲区按 dpr 放大，逻辑坐标仍是 CSS 像素）
  var canvas = document.createElement('canvas');
  canvas.className = 'wordcloud-canvas';
  function cloudHeight() {
    var headH = window.innerWidth <= 767 ? 100 : 72;
    return Math.max(560, window.innerHeight - headH - 48);
  }
  function setup(w, h) {
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    var c = canvas.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    return c;
  }

  var placedAll = [];
  try {
    var W = parent.clientWidth, H = cloudHeight();
    var ctx = setup(W, H);
    placedAll = layout(ctx, W, H) || [];
    if (!placedAll.length) throw new Error('empty layout');
    parent.insertBefore(canvas, oldBox);
    oldBox.hidden = true;   // 隐藏原云，保留 DOM 作降级 fallback

    // 暴露调试句柄
    window.__zzhWordcloud = { canvas: canvas, tags: tags, placed: placedAll };

    // 点击/悬停命中（矩形盒近似）
    function hitAt(ev) {
      var r = canvas.getBoundingClientRect();
      var x = ev.clientX - r.left, y = ev.clientY - r.top;
      for (var i = 0; i < placedAll.length; i++) {
        var p = placedAll[i].box;
        if (x >= p.x && x <= p.x + p.w && y >= p.y && y <= p.y + p.h) return placedAll[i].it.tag;
      }
      return null;
    }
    canvas.addEventListener('click', function (ev) {
      var t = hitAt(ev);
      if (t) window.location.href = '/zzh-notes/' + t.path;
    });
    canvas.addEventListener('mousemove', function (ev) {
      canvas.style.cursor = hitAt(ev) ? 'pointer' : 'default';
    });

    // resize 重绘（debounce 150ms），宽高按当前视口重算
    var rt;
    window.addEventListener('resize', function () {
      clearTimeout(rt);
      rt = setTimeout(function () {
        var w2 = parent.clientWidth, h2 = cloudHeight();
        var c2 = setup(w2, h2);
        var p2 = layout(c2, w2, h2);
        if (p2 && p2.length) placedAll = p2;
      }, 150);
    });
  } catch (err) {
    console.warn('[ZZH] 词云绘制异常，降级为默认标签云：', err);
    if (canvas.parentNode) canvas.remove();
    oldBox.hidden = false;   // 恢复原云
  }
})();</script></body></html>
