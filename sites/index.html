  'use strict';
  var KEY = 'zzh-auth';
  window.ZzhAuth = {
    read: function () {
      try {
        var raw = localStorage.getItem(KEY);
        if (!raw) return null;
        var s = JSON.parse(raw);
        if (!s || typeof s.u !== 'string' ||
            (s.r !== 'admin' && s.r !== 'user') ||
            typeof s.e !== 'number' || s.e <= Date.now()) {
          localStorage.removeItem(KEY);
          localStorage.removeItem('zzh-gh-token'); // 会话过期即清写作台令牌（登出/过期同清，与 logout() 同步）
          return null;
        }
        return s;
      } catch (e) { return null; }
    },
    logout: function () {
      // 登出四键同清：'zzh-cek'（内容密钥）、'zzh-pkey'（私密板块密钥，仅 admin）、
      // 'zzh-gh-token'（写作台访问令牌，仅 admin）与 'zzh-auth'（登录态）同生共死。
      // 同步副本：scripts/login-page.js 的 logout()（含写作台键）与 scripts/zzh-post-cipher.js
      // 注入脚本的 GCM 失败清理——三处改一处必须同步其余（会话多键 + 私钥约定）。
      try {
        localStorage.removeItem(KEY);
        localStorage.removeItem('zzh-cek');
        localStorage.removeItem('zzh-pkey');
        localStorage.removeItem('zzh-gh-token');
      } catch (e) {}
      location.reload();
    }
  };
  var s = window.ZzhAuth.read();
  var chip = document.getElementById('zzh-auth-chip');
  if (s && chip) {
    chip.hidden = false;
    var name = chip.querySelector('.zzh-auth-chip-name');
    if (name) name.textContent = s.u;
    if (s.r === 'admin') chip.classList.add('is-admin');
  }
  // 私密板块入口：仅 admin 会话显示（登出 logout() reload 后本脚本重跑即隐藏）
  var priv = document.getElementById('zzh-private-nav');
  if (priv) priv.hidden = !(s && s.r === 'admin');
  var btn = document.getElementById('zzh-auth-chip-logout');
  if (btn) {
    btn.addEventListener('click', function (e) {
      e.preventDefault();
      window.ZzhAuth.logout();
    });
  }
})();</script></header></div><div class="main-inner page posts-expand"><div class="post-block" lang="zh-CN"><div class="post-body"><div class="zzh-gate" id="zzh-gate"><div class="zzh-gate-card"><span class="zzh-gate-icon" aria-hidden="true"><i class="fa fa-lock"></i></span><p class="zzh-gate-title">本页内容已加密</p><p class="zzh-gate-desc">登录后可阅读全文；已登录的浏览器会在打开本页时自动解密显示正文。</p><p class="zzh-gate-load" role="status"><span class="zzh-gate-spin" aria-hidden="true"></span>正在解密内容…</p><a class="zzh-gate-btn" href="/zzh-notes/login/">前往登录</a><p class="zzh-gate-err" id="zzh-gate-err" hidden></p></div></div><script type="application/json" id="zzh-cipher-data">{"v":1,"alg":"AES-256-GCM","iv":"f996ee0434de45cea723de1f","ct":"ZHeoacl7Ec368bvCEbkTwNwpwpAt3ejtH9lOem4nlv8V32awh0ggiyBSOSXTKkQY4CDA4Fw1ie0nmPeMxMJU5FnJZXAGFV7S7qtYZNE0fmYp8GGrBM1z5IIK1IniQGdfyLHiCdXG9eNz5N8MmVwpLPqDhAqxkqa8UaELqXNfA68UQzXasWakILbLrGAaxxAAvieUT/6DkH9UXRcERZ2c69oCTb9ocGQ9YPmSftUOdzq5eNzEx7OPYRlzUBH6/E14H1vj+gw3gkJHQv89KHKImlPLs4UVY/0lVHaQjTiWFh/RdScmJ/7HrJe6p+OzMXJkDg3a1OFlUU6myuYQbQ7vdm+Uy1rl27bTKlBZIRP5iJFN2XMXRtfs55JrhqUH+TAXLtg+Wp2ARly4vHIidqY1UUd/zN1mwRQ95ARJjkTKP3BDwRtpOW1RVr12Xq/57COTf5igAyjY2EXtyQRVuEivMGAPANYOtAQobWmYyF0HuVXpt9CRCARUTM5Zw/ss8bRQlUUJim/mylytqpYV4dYaDQclnn81FM+M/gxcLtRQg7cfoOZMzYblnLZGUGRfW+xGKDO+Eh4r3NuNgDipEm9mEBV4EdqiObtB7pNWXlAXCdCQMU1spMSDGBlKANl4+gHkPSqJ7LgHehJrqYDxXrwiw484kdXVClXy9RtGAAwuQyx6QSr5fGBlsAeSuXvy6cnMFxaOPBkigqiOYfekISreQdS+qZtV3Dnc/+5fddWv3S8Pr+PIDed90U9q5kVIZ1VljBUSY2mBH9pa329n1bHn32lLTUTa3j8ri05hcgYAZ6knUHGCHZl/gjveMH9AuKKvI3+m6jTmN8+YHS6566CChsqR7rW0Oz3Vap7YCsXtv6SKfagMhMpEivNN9YT803Gw3MDUNeplnchvgzQdh2bLrKNGZxEvvjDLj3/uRQAcohyc9d4rt1ycAEd7wboOHyMsYvL3Ty2OadpaucihyqENDgVTNBmEoxq3k/QjJWddpwdxAu2Qo7FRhFIR+AfesZsOZTYpfTFaLsgoHB12OLAm9Tp+HIvvJQ0DgSj0/KgIqfVUR2IdHwZsvfx1KL+lWMnJ0Pho6W6XfjMu0kl/Y34/KRr8MNw+euWNRzktiWEklXRbbOejW9CDLDnwDuC9sPz8MO83d0C5SCyC20zwBqLPunzFlSWytYjELjHXJuFU0i4NASkZ5U7dwcRNip85elDe5482Rpu2kGkdtxZLpkVwvs2EiSbV2wW7Qce0C1H/t0bu0VcPfTEXmyOWQ8SXvo0mLmm+
