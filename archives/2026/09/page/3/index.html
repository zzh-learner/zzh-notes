<script>
(function () {
  'use strict';
  var KEY = 'zzh-auth';
  window.ZzhAuth = {
    read: function () {
      try {
        var raw = localStorage.getItem(KEY);
        if (!raw) return null;
        var s = JSON.parse(raw);
        if (!s || typeof s.u !== 'string' ||
            (s.r !== 'admin' && s.r !== 'user') ||
            typeof s.e !== 'number' || s.e <= Date.now()) {
          localStorage.removeItem(KEY);
          return null;
        }
        return s;
      } catch (e) { return null; }
    },
    logout: function () {
      // 登出三键同清：'zzh-cek'（内容密钥）、'zzh-pkey'（私密板块密钥，仅 admin）
      // 与 'zzh-auth'（登录态）同生共死。
      // 同步副本：scripts/login-page.js 的 logout() 与 scripts/zzh-post-cipher.js
      // 注入脚本的 GCM 失败清理——三处改一处必须同步其余（会话双键 + 私钥约定）。
      try {
        localStorage.removeItem(KEY);
        localStorage.removeItem('zzh-cek');
        localStorage.removeItem('zzh-pkey');
      } catch (e) {}
      location.reload();
    }
  };
  var s = window.ZzhAuth.read();
  var chip = document.getElementById('zzh-auth-chip');
  if (s && chip) {
    chip.hidden = false;
    var name = chip.querySelector('.zzh-auth-chip-name');
    if (name) name.textContent = s.u;
    if (s.r === 'admin') chip.classList.add('is-admin');
  }
  // 私密板块入口：仅 admin 会话显示（登出 logout() reload 后本脚本重跑即隐藏）
  var priv = document.getElementById('zzh-private-nav');
  if (priv) priv.hidden = !(s && s.r === 'admin');
  var btn = document.getElementById('zzh-auth-chip-logout');
  if (btn) {
    btn.addEventListener('click', function (e) {
      e.preventDefault();
      window.ZzhAuth.logout();
    });
  }
})();
</script>

<script>
(function () {
  'use strict';
  var CEK_KEY = 'zzh-cek';
  var AUTH_KEY = 'zzh-auth'; // 与 header.njk / scripts/login-page.js 同键（会话双键副本约定，注释互指）
  var PKEY_KEY = 'zzh-pkey'; // 私密板块密钥：全局解密失败登出时随之清除（与 login-page.js / header.njk 清除点同步）
  var dataEl = document.getElementById('zzh-cipher-data');
  var gateEl = document.getElementById('zzh-gate');
  var errEl = document.getElementById('zzh-gate-err');

  function fail(msg) { if (errEl) { errEl.textContent = msg; errEl.hidden = false; } }

  function whenReady(fn) {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function () { setTimeout(fn, 0); });
    } else {
      setTimeout(fn, 0);
    }
  }

  function hexToBytes(hex) {
    var out = new Uint8Array(hex.length / 2);
    for (var i = 0; i < out.length; i++) out[i] = parseInt(hex.substr(i * 2, 2), 16);
    return out;
  }

  function b64ToBytes(b64) {
    var bin = atob(b64);
    var out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  // 与 header.njk 的 ZzhAuth.read 同构的防御校验副本：形状损坏/过期即删
  function readCek() {
    try {
      var raw = localStorage.getItem(CEK_KEY);
      if (!raw) return null;
      var s = JSON.parse(raw);
      if (!s || s.v !== 1 || typeof s.k !== 'string' || !/^[0-9a-f]{64}$/.test(s.k) ||
          typeof s.e !== 'number' || s.e <= Date.now()) {
        localStorage.removeItem(CEK_KEY);
        return null;
      }
      return s;
    } catch (e) { return null; }
  }

  var rebindDone = false;
  function rebind() {
    if (rebindDone) return;
    rebindDone = true;
    document.body.classList.add('zzh-decrypted'); // 隐藏详情页头部固定引导行（styles.styl）
    try { document.dispatchEvent(new Event('page:loaded', { bubbles: true })); } catch (e) {}
    var utils = window.NexT && window.NexT.utils;
    if (utils) {
      if (typeof utils.wrapTableWithBox === 'function') { try { utils.wrapTableWithBox(); } catch (e) {} }
      if (typeof utils.registerCodeblock === 'function') { try { utils.registerCodeblock(); } catch (e) {} }
      if (typeof utils.registerTabsTag === 'function') { try { utils.registerTabsTag(); } catch (e) {} }
      if (typeof utils.registerVideoIframe === 'function') { try { utils.registerVideoIframe(); } catch (e) {} }
    }
    rebuildToc();
    if (utils && typeof utils.registerSidebarTOC === 'function') { try { utils.registerSidebarTOC(); } catch (e) {} }
    if (window.ScrollTrigger) { try { window.ScrollTrigger.refresh(); } catch (e) {} }
  }

  // 客户端重建侧栏 TOC（本站当前未开 toc，未来开启时此路径生效）
  function rebuildToc() {
    var wrap = document.querySelector('.post-toc-wrap');
    if (!wrap) return;
    var box = wrap.querySelector('.post-toc');
    if (box && box.children.length) return;
    var body = document.querySelector('.post-body');
    if (!body) return;
    var hs = body.querySelectorAll('h2, h3');
    if (!hs.length) return;
    var ol = document.createElement('ol');
    ol.className = 'nav';
    Array.prototype.forEach.call(hs, function (h) {
      if (!h.id) return;
      var li = document.createElement('li');
      li.className = 'toc-item toc-level-' + h.tagName.toLowerCase().slice(1);
      var a = document.createElement('a');
      a.className = 'toc-link';
      a.href = '#' + h.id;
      var span = document.createElement('span');
      span.className = 'toc-text';
      span.textContent = h.textContent;
      a.appendChild(span);
      li.appendChild(a);
      ol.appendChild(li);
    });
    if (!ol.children.length) return;
    if (!box) {
      box = document.createElement('div');
      box.className = 'post-toc animated';
      wrap.appendChild(box);
    }
    box.appendChild(ol);
  }

  function inject(plainHtml) {
    if (!gateEl || !gateEl.parentNode) return;
    var tpl = document.createElement('template');
    tpl.innerHTML = plainHtml; // template 内容惰性，<script> 解析后不执行（spec：已置 already-started）
    // 收集内容里的内联脚本，插入后逐个换新节点触发执行（随机一图页等内容带脚本；
    // 直接搬旧节点不会执行——template 里的 script 移入文档也被跳过）。文档顺序执行。
    var scripts = Array.prototype.slice.call(tpl.content.querySelectorAll('script'));
    gateEl.parentNode.replaceChild(tpl.content, gateEl);
    for (var i = 0; i < scripts.length; i++) {
      var old = scripts[i];
      var s = document.createElement('script');
      for (var j = 0; j < old.attributes.length; j++) {
        s.setAttribute(old.attributes[j].name, old.attributes[j].value);
      }
      s.text = old.text; // 仅内联脚本（门禁内容页的 script 均为内联，无 src）
      if (old.parentNode) old.parentNode.replaceChild(s, old);
    }
    if (dataEl && dataEl.parentNode) dataEl.parentNode.removeChild(dataEl);
    rebind();
  }

  // 跨标签页：另一标签登录/登出（zzh-cek 变化）后本标签自动刷新出正文/引导卡
  window.addEventListener('storage', function (ev) {
    if (ev && ev.key === CEK_KEY) location.reload();
  });

  whenReady(function () {
    var subtle = window.crypto && window.crypto.subtle;
    if (!subtle) { fail('当前环境不支持解密（需 HTTPS 或 localhost 访问）'); return; }
    var cek = readCek();
    if (!cek) {
      var logged = false;
      try { logged = !!localStorage.getItem(AUTH_KEY); } catch (e) {}
      if (logged) fail('已登录但本浏览器没有有效的内容密钥（可能密钥已轮换），请重新登录');
      return;
    }
    var payload = null;
    try { payload = JSON.parse(dataEl.textContent); } catch (e) { payload = null; }
    if (!payload || payload.v !== 1 || typeof payload.iv !== 'string' || typeof payload.ct !== 'string') {
      fail('密文数据损坏，请重新构建');
      return;
    }
    subtle.importKey('raw', hexToBytes(cek.k), 'AES-GCM', false, ['decrypt']).then(function (key) {
      return subtle.decrypt({ name: 'AES-GCM', iv: hexToBytes(payload.iv) }, key, b64ToBytes(payload.ct));
    }).then(function (plain) {
      inject(new TextDecoder().decode(plain));
    }).catch(function () {
      try { localStorage.removeItem(CEK_KEY); localStorage.removeItem(AUTH_KEY); localStorage.removeItem(PKEY_KEY); } catch (e) {}
      fail('解密失败：内容密钥已轮换，已自动登出，请重新登录');
    });
  });
})();

<script>
(function () {
  var STORAGE_KEY = 'bg-opacity';
  var DEFAULT = 50;   // 0=完全隐藏背景图，100=完全可见

  // 滑块值（0-100）→ 遮罩 opacity（1-0）：值越大，遮罩越透明，背景图越清晰
  function applyOpacity(sliderVal) {
    var overlayOpacity = 1 - sliderVal / 100;
    document.documentElement.style.setProperty('--bg-overlay-opacity', overlayOpacity);
  }

  // Layer 1: 初始化（首次读 localStorage）
  var stored = null;
  try { stored = parseInt(localStorage.getItem(STORAGE_KEY), 10); } catch (e) {}
  var initial = (isNaN(stored) || stored < 0 || stored > 100) ? DEFAULT : stored;

  var slider = document.getElementById('bg-slider');
  var toggleBtn = document.getElementById('bg-toggle');
  var popover = document.getElementById('bg-popover');
  // 任一 DOM 缺失则静默退出，不阻塞其他脚本
  if (!slider || !toggleBtn || !popover) return;

  slider.value = initial;
  applyOpacity(initial);

  // Layer 2: 滑块拖动（实时更新 CSS 变量 + debounce 写 localStorage）
  var saveTimer = null;
  slider.addEventListener('input', function () {
    var v = parseInt(slider.value, 10);
    applyOpacity(v);
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      try { localStorage.setItem(STORAGE_KEY, String(v)); } catch (e) {}
    }, 200);
  });

  // Layer 3: popover 开关
  function open() {
    popover.hidden = false;
    toggleBtn.setAttribute('aria-expanded', 'true');
    slider.focus();
  }
  function close() {
    popover.hidden = true;
    toggleBtn.setAttribute('aria-expanded', 'false');
  }
  function isOpen() { return !popover.hidden; }

  // 点按钮 toggle（stopPropagation 防触发下面的"点外部关闭"）
  toggleBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    if (isOpen()) { close(); } else { open(); }
  });
  // 点 popover 外部关闭
  document.addEventListener('click', function (e) {
    if (!isOpen()) return;
    if (!popover.contains(e.target) && e.target !== toggleBtn) close();
  });
  // Esc 关闭，焦点回按钮
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && isOpen()) {
      close();
      toggleBtn.focus();
    }
  });
})();
</script>



<script type="module">
  (async function () {
    var THREE;
    // ① CDN 加载兜底
    try {
      THREE = await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js');
    } catch (e) {
      console.warn('[ZZH] Three.js 加载失败，星空降级为纯色底');
      return;
    }

    // ② WebGL 支持检测
    var testCtx = document.createElement('canvas').getContext('webgl2') ||
                 document.createElement('canvas').getContext('webgl');
    if (!testCtx) {
      console.warn('[ZZH] WebGL 不支持，星空降级为纯色底');
      return;
    }

    try {
      // === 创建 canvas 注入 body 首子节点（失败则无残留） ===
      var canvas = document.createElement('canvas');
      canvas.id = 'starfield';
      document.body.insertBefore(canvas, document.body.firstChild);

      var scene = new THREE.Scene();
      var camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.z = 1;

      var renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);

      // root Group：Task 4 的整体漂移挂这里
      var group = new THREE.Group();
      scene.add(group);

      // === 确定性随机：种子 PRNG，让星点/星云布局每页相同（跨分页不"重置位置"） ===
      // mulberry32：给定相同种子产生相同序列。固定种子 20260723 → 每页星空布局一致。
      // 运行时流星生成仍用 Math.random()（流星本就该不可预测）。
      var SEED = 20260723;
      function mulberry32(a) {
        return function () {
          a |= 0; a = a + 0x6D2B79F5 | 0;
          var t = a;
          t = Math.imul(t ^ t >>> 15, t | 1);
          t ^= t + Math.imul(t ^ t >>> 7, t | 61);
          return ((t ^ t >>> 14) >>> 0) / 4294967296;
        };
      }
      var rnd = mulberry32(SEED);

      // === Layer 1：星点（球面随机分布 + 逐星闪烁） ===
      var STAR_COUNT = 1000;
      var positions = new Float32Array(STAR_COUNT * 3);
      var scales = new Float32Array(STAR_COUNT);
      var phases = new Float32Array(STAR_COUNT);
      var colors = new Float32Array(STAR_COUNT * 3);

      var warmColor = new THREE.Color('#fff5e6');
      var blueColor = new THREE.Color('#cce8ff');

      for (var i = 0; i < STAR_COUNT; i++) {
        // 球面均匀分布：半径 5-50
        var r = 5 + rnd() * 45;
        var theta = rnd() * Math.PI * 2;
        var phi = Math.acos(2 * rnd() - 1);
        positions[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
        positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
        positions[i * 3 + 2] = r * Math.cos(phi);

        scales[i] = 0.5 + rnd() * 1.5;
        phases[i] = rnd() * Math.PI * 2;

        var c = rnd() < 0.1 ? blueColor : warmColor;
        colors[i * 3]     = c.r;
        colors[i * 3 + 1] = c.g;
        colors[i * 3 + 2] = c.b;
      }

      var starGeo = new THREE.BufferGeometry();
      starGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      starGeo.setAttribute('aScale', new THREE.BufferAttribute(scales, 1));
      starGeo.setAttribute('aPhase', new THREE.BufferAttribute(phases, 1));
      starGeo.setAttribute('aColor', new THREE.BufferAttribute(colors, 3));

      var starMat = new THREE.ShaderMaterial({
        uniforms: {
          uTime: { value: 0 },
          uPixelRatio: { value: Math.min(window.devicePixelRatio, 2) }
        },
        vertexShader: [
          'attribute float aScale;',
          'attribute float aPhase;',
          'attribute vec3 aColor;',
          'varying vec3 vColor;',
          'varying float vTwinkle;',
          'uniform float uTime;',
          'uniform float uPixelRatio;',
          'void main() {',
          '  vColor = aColor;',
          '  vTwinkle = 0.6 + 0.4 * sin(uTime * 2.0 + aPhase);',  // ~3s 周期闪烁
          '  vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);',
          '  gl_PointSize = aScale * 2.0 * uPixelRatio * (50.0 / -mvPosition.z);',
          '  gl_Position = projectionMatrix * mvPosition;',
          '}'
        ].join('\n'),
        fragmentShader: [
          'varying vec3 vColor;',
          'varying float vTwinkle;',
          'void main() {',
          '  vec2 uv = gl_PointCoord - vec2(0.5);',
          '  float d = length(uv);',
          '  if (d > 0.5) discard;',                  // 软边圆，非硬方块
          '  float alpha = (1.0 - d * 2.0) * vTwinkle;',
          '  gl_FragColor = vec4(vColor, alpha);',
          '}'
        ].join('\n'),
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      });

      var stars = new THREE.Points(starGeo, starMat);
      group.add(stars);

      // === Layer 2：星云（3-4 团软光晕，Canvas 程序生成径向渐变纹理） ===
      var nebulaColors = ['#2a1a4a', '#0a3a4a', '#3a1a1a', '#1a2a4a'];
      var nebulaCount = 3 + Math.floor(rnd() * 2);  // 3 或 4 团（种子决定，每页一致）

      // 生成径向渐变纹理（128x128，中心有色→边缘渐变透明）
      function makeNebulaTexture(hexColor) {
        var size = 128;
        var c = document.createElement('canvas');
        c.width = size; c.height = size;
        var ctx = c.getContext('2d');
        var grad = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
        grad.addColorStop(0, hexColor);
        grad.addColorStop(0.5, hexColor);
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, size, size);
        var tex = new THREE.CanvasTexture(c);
        return tex;
      }

      var nebulaGroup = new THREE.Group();
      group.add(nebulaGroup);  // 挂在 group 下，随漂移一起转

      for (var n = 0; n < nebulaCount; n++) {
        var r = 10 + rnd() * 30;
        var theta = rnd() * Math.PI * 2;
        var phi = Math.acos(2 * rnd() - 1);
        var geo = new THREE.PlaneGeometry(8 + rnd() * 7, 8 + rnd() * 7);
        var mat = new THREE.MeshBasicMaterial({
          map: makeNebulaTexture(nebulaColors[n % nebulaColors.length]),
          transparent: true,
          opacity: 0.15 + rnd() * 0.10,
          depthWrite: false,
          blending: THREE.AdditiveBlending
        });
        var mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(
          r * Math.sin(phi) * Math.cos(theta),
          r * Math.sin(phi) * Math.sin(theta),
          r * Math.cos(phi)
        );
        mesh.userData.spinSpeed = (0.02 + rnd() * 0.03) * (rnd() < 0.5 ? -1 : 1);
        nebulaGroup.add(mesh);
      }

      // === Layer 3：流星（偶发，JS 管生命周期） ===
      // nextMeteorTime 在下方 RAF 段定义（含跨页时间偏移）。
      var meteors = [];

      function spawnMeteor() {
        // 屏幕外随机起点（NDC ±1.5），随机方向
        var startX = (Math.random() - 0.5) * 3;
        var startY = (Math.random() - 0.5) * 3;
        var startZ = -0.5;
        var pts = [
          new THREE.Vector3(startX, startY, startZ),
          new THREE.Vector3(startX, startY, startZ)  // 尾部初始同点
        ];
        var geo = new THREE.BufferGeometry().setFromPoints(pts);
        // 顶点颜色 alpha 渐变（头部亮，尾部透明）
        var vertColors = new Float32Array([
          1.0, 1.0, 1.0,  // 头部白
          1.0, 1.0, 1.0   // 尾部白（alpha 由 LineBasicMaterial.transparent 管，此处用 opacity 整体）
        ]);
        geo.setAttribute('color', new THREE.BufferAttribute(vertColors, 3));
        var mat = new THREE.LineBasicMaterial({
          vertexColors: true,
          transparent: true,
          opacity: 0.9,
          blending: THREE.AdditiveBlending
        });
        var line = new THREE.Line(geo, mat);
        // 投影到星空球面（半径 8，在星点层前方）
        var dir = new THREE.Vector3(
          (Math.random() - 0.5) * 2,
          (Math.random() - 0.5) * 2,
          0
        ).normalize();
        line.userData = {
          dir: dir,
          speed: 0.08 + Math.random() * 0.05,
          life: 0,
          maxLife: 0.8 + Math.random() * 0.7,  // 0.8-1.5s
          startWorld: new THREE.Vector3(startX * 8, startY * 8, startZ * 8)
        };
        group.add(line);
        meteors.push(line);
      }

      // === RAF 循环（Task 3 只做星点；Task 4 加星云/流星/漂移） ===
      var rafId = null;
      var running = false;
      var clock = new THREE.Clock();
      var lastFrameTime = null;  // Task 4 手动算 dt 用（避免 getDelta/getElapsedTime 冲突）

      // === 跨页面时间连续性：整页跳转（无 pjax）时 canvas 会重建，
      // 用 sessionStorage 记录会话累计时间偏移，让漂移/闪烁/流星计时跨页接续，
      // 视觉上星空"在同一位置继续转"而非"从零重新开始"。
      var TIME_KEY = 'starfield-time-offset';
      var DRIFT_RATE = 0.0013;  // 弧度/帧（原 80s/圈）
      var FPS_BASE = 60;        // 漂移按 60fps 换算到时间（rotation = time * DRIFT_RATE * FPS_BASE）
      var timeOffset = 0;
      var nextMeteorTime = 0;   // 绝对动画时间（含 offset）
      try {
        var stored = parseFloat(sessionStorage.getItem(TIME_KEY));
        if (!isNaN(stored) && stored > 0) {
          timeOffset = stored;
        }
      } catch (e) {}
      // 初始流星时间：首颗 3-8s 后（相对当前 offset）
      nextMeteorTime = timeOffset + 3 + Math.random() * 5;
      // 漂移角度按已累计时间预置，避免跳页后旋转"跳回 0"
      group.rotation.y = timeOffset * DRIFT_RATE * FPS_BASE;

      function animate() {
        rafId = requestAnimationFrame(animate);
        // 绝对动画时间 = 本页 clock 时间 + 跨页累计偏移（sessionStorage）
        var t = clock.getElapsedTime() + timeOffset;
        starMat.uniforms.uTime.value = t;
        // Layer 4：整体漂移——改为时间驱动（从 t 直接算），跨页不跳。
        // 原 += 0.0013/帧 换算：0.0013 * 60fps = 0.078 rad/s。
        group.rotation.y = t * DRIFT_RATE * FPS_BASE;
        // 星云缓慢自转（每团方向随机）+ 每帧重新朝相机（spec §6.4：
        // 星云挂 group 随漂移，但每帧 lookAt(camera.position) 保证始终正面）
        for (var ni = 0; ni < nebulaGroup.children.length; ni++) {
          nebulaGroup.children[ni].rotation.z += nebulaGroup.children[ni].userData.spinSpeed * 0.01;
          nebulaGroup.children[ni].lookAt(camera.position);
        }

        // 流星推进 + 生命周期回收
        // 注意：不能混用 clock.getElapsedTime() 和 clock.getDelta()——
        // getElapsedTime() 内部已更新 oldTime，同帧再调 getDelta() 会返回 ~0，
        // 导致流星 dt 归零、不动也不消失。用手动算 dt：
        var dt = lastFrameTime === null ? 0.016 : (t - lastFrameTime);
        lastFrameTime = t;
        if (t >= nextMeteorTime) {
          spawnMeteor();
          nextMeteorTime = t + 3 + Math.random() * 5;  // 下一颗 3-8s 后（运行时随机）
        }
        for (var mi = meteors.length - 1; mi >= 0; mi--) {
          var m = meteors[mi];
          m.userData.life += dt;
          if (m.userData.life >= m.userData.maxLife) {
            group.remove(m);
            m.geometry.dispose();
            m.material.dispose();
            meteors.splice(mi, 1);
          } else {
            // 头部沿 dir 移动，尾部跟随（拖尾长度随速度）
            var head = m.userData.startWorld.clone().add(
              m.userData.dir.clone().multiplyScalar(m.userData.speed * m.userData.life * 60)
            );
            var tail = head.clone().sub(
              m.userData.dir.clone().multiplyScalar(2.5)  // 拖尾长度
            );
            var posAttr = m.geometry.attributes.position;
            posAttr.setXYZ(0, head.x, head.y, head.z);
            posAttr.setXYZ(1, tail.x, tail.y, tail.z);
            posAttr.needsUpdate = true;
            // 淡出：生命后半 alpha 衰减
            m.material.opacity = m.userData.life > m.userData.maxLife * 0.6
              ? 0.9 * (1 - (m.userData.life - m.userData.maxLife * 0.6) / (m.userData.maxLife * 0.4))
              : 0.9;
          }
        }
        renderer.render(scene, camera);
      }

      function start() {
        if (running) return;
        running = true;
        lastFrameTime = null;  // 重置 dt 基准，避免长暂停后首帧 dt 过大导致流星跳变
        animate();
      }
      function stop() {
        running = false;
        if (rafId) cancelAnimationFrame(rafId);
        rafId = null;
      }

      // === 跨页时间持久化：整页跳转前把累计动画时间写 sessionStorage，
      // 下一页读取后接续，星空不"从零重置"。 ===
      function saveTimeOffset() {
        // 用当前 uTime（已含 offset）作为下一页起点
        try { sessionStorage.setItem(TIME_KEY, String(starMat.uniforms.uTime.value)); } catch (e) {}
      }
      window.addEventListener('pagehide', saveTimeOffset);  // 整页导航触发

      // === reduced-motion：渲染一帧静态星空后停 ===
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        starMat.uniforms.uTime.value = 0;
        renderer.render(scene, camera);
        console.warn('[ZZH] prefers-reduced-motion，星空渲染静态一帧后停止动画');
      } else {
        start();
      }

      // === tab 可见性：隐藏时停 RAF 省电 ===
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
          saveTimeOffset();  // 后台/切走也存一下，防 pagehide 未触发
          stop();
        } else if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          start();
        }
      });

      // === resize：debounce 150ms ===
      var resizeTimer = null;
      window.addEventListener('resize', function () {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function () {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        }, 150);
      });

      // 暴露给调试/外部（start/stop + 场景对象）
      window.__zzhStarfield = { start: start, stop: stop, scene: scene, camera: camera, renderer: renderer, group: group, THREE: THREE };

    } catch (err) {
      console.warn('[ZZH] 星空场景初始化异常，降级为纯色底：', err);
      // 移除可能半创建的 canvas，零残留
      var bad = document.getElementById('starfield');
      if (bad) bad.remove();
    }
  })();
</script>



<script defer src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

<script>
window.addEventListener('load', function () {
  // 工程兜底 1：尊重 prefers-reduced-motion，直接返回（内容保持可见）
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    return;
  }

  // 工程兜底 2：检查 GSAP 是否加载成功
  if (typeof gsap === 'undefined' || typeof ScrollTrigger === 'undefined') {
    console.warn('[ZZH] GSAP 未加载，动效跳过，内容保持可见');
    return;
  }

  // 工程兜底 3（新增）：恢复函数。任何动效代码抛异常时调用，
  // 把所有 fade-up 元素的 opacity 强制设回 1，保证内容可见。
  // 这是对 gsap-ready gate 的补充——原 gate 只防"GSAP 加载失败"，
  // 但"GSAP 加载成功后我的代码崩了"会导致内容永久 opacity:0，需要额外兜底。
  function revealAllFadeUp() {
    document.querySelectorAll('.fade-up').forEach(function (el) {
      el.style.opacity = '1';
      el.style.transform = 'none';
    });
    document.querySelectorAll('.post-body img').forEach(function (img) {
      img.style.opacity = '1';
    });
  }

  gsap.registerPlugin(ScrollTrigger);

  // 工程兜底 4：加 gsap-ready 类，激活 .fade-up 的初始 opacity:0
  // 这一步在 GSAP 确认可用后才做，保证加载失败时内容不消失
  document.documentElement.classList.add('gsap-ready');

  // 整个动效逻辑包进 try/catch：任何一段崩了都不能让内容永久隐藏
  try {

    // === 动效 1：阅读进度条 ===
    var bar = document.querySelector('.reading-progress-bar');
    if (bar) {
      ScrollTrigger.create({
        trigger: document.body,
        start: 'top top',
        end: 'bottom bottom',
        onUpdate: function (self) {
          bar.style.width = (self.progress * 100) + '%';
        }
      });
    }

    // === 动效 2：首页文章卡片 stagger fade-up ===
    var cards = document.querySelectorAll('.posts-expand .post-block');
    if (cards.length) {
      cards.forEach(function (c) { c.classList.add('fade-up'); });
      gsap.to(cards, {
        opacity: 1,
        y: 0,
        duration: 0.5,
        stagger: 0.08,
        ease: 'power2.out',
        scrollTrigger: {
          trigger: '.posts-expand',
          start: 'top 85%'
        }
      });
    }

    // === 动效 3：文章页 H2/H3 fade-up ===
    // 注意：批量 gsap.to 不能用 trigger 函数（之前 bug：trigger: h => h
    // 会让 ScrollTrigger 调用 h.getBoundingClientRect()，但函数没有该方法，
    // 抛 TypeError 让整个动效链条中断，导致卡片永远 opacity:0）。
    // 正确做法：forEach 每个 heading 单独 gsap.to，trigger 直接传元素本身。
    var headings = document.querySelectorAll('.post-body h2, .post-body h3');
    if (headings.length) {
      headings.forEach(function (h) {
        h.classList.add('fade-up');
        gsap.to(h, {
          opacity: 1,
          y: 0,
          duration: 0.4,
          ease: 'power2.out',
          scrollTrigger: {
            trigger: h,
            start: 'top 90%'
          }
        });
      });
    }

    // === 动效 4：文章图片 lazyload fade-in ===
    // 这段不走 GSAP，纯 JS 设 inline style。初始 opacity:0 由 inline style 控制，
    // 不依赖 gsap-ready class，所以 try/catch 不影响它。
    // 但加 onError 兜底：图片加载失败也要恢复 opacity，否则永久不可见。
    // ⚠ 门禁页（正文加密）的 .post-body 内容是解密后才注入的（注入脚本派发
    // page:loaded），只在本 load 跑一次会漏掉它们——图留着 CSS 初始 opacity:0
    // 永久不可见。所以封装成函数，load 与 page:loaded 各跑一遍（幂等）。
    var revealImages = function () {
      document.querySelectorAll('.post-body img').forEach(function (img) {
        if (img.complete && img.naturalWidth > 0) {
          img.style.opacity = 1;
        } else {
          img.style.opacity = 0;
          img.style.transition = 'opacity 0.3s ease';
          img.addEventListener('load', function () { img.style.opacity = 1; });
          img.addEventListener('error', function () { img.style.opacity = 1; });
        }
      });
    };
    revealImages();
    document.addEventListener('page:loaded', revealImages);

    // === header 滚动收缩 ===
    var header = document.querySelector('.custom-header');
    if (header) {
      ScrollTrigger.create({
        trigger: document.body,
        start: 'top -80',
        end: 99999,
        toggleClass: { targets: header, className: 'scrolled' }
      });
    }

  } catch (err) {
    // 兜底：任何动效代码崩了，恢复所有 fade-up 和图片可见
    console.error('[ZZH] 动效代码异常，已恢复内容可见：', err);
    revealAllFadeUp();
  }
});
</script>




<script>
(function () {
  // ① 仅在标签页执行（避免污染全站）
  var path = window.location.pathname.replace(/\/+$/, '');
  if (!path.endsWith('/tags')) return;

  // ② 读取构建期注入的标签数据（Nunjucks 渲染期内联成 JS 数组字面量）
  var tags = ;
  if (!tags || !tags.length) return;

  // ③ 原 NexT 标签云容器（作为降级 fallback，JS 成功后隐藏）
  var oldBox = document.querySelector('.tag-cloud-tags');
  var parent = oldBox ? oldBox.parentElement : null;
  if (!parent) return;

  // ④ 能力检测：canvas 2d 上下文（不支持则静默降级）
  var testCanvas = document.createElement('canvas');
  if (!testCanvas.getContext || !testCanvas.getContext('2d')) return;

  // ⑤ 动态加载 wordcloud2.js（UMD，挂到 window.WordCloud）
  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = src;
      s.onload = resolve;
      s.onerror = function () { reject(new Error('script load failed: ' + src)); };
      document.head.appendChild(s);
    });
  }

  // ⑥ 渲染配置（闭包内复用，供 resize 重绘）
  var PALETTE = ['#7ee787', '#79c0ff', '#d2a8ff', '#ffa657', '#ff7b72', '#56d4dd'];
  var maxC = Math.max.apply(null, tags.map(function (t) { return t.count; }));
  var list = tags.map(function (t) {
    return [t.name, Math.max(1, Math.round(t.count / maxC * 10))];
  });

  function buildOptions(canvas) {
    return {
      list: list,
      fontFamily: '"Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif',
      fontWeight: function (w) { return w >= 7 ? '600' : '400'; },
      color: function () {
        return PALETTE[Math.floor(Math.random() * PALETTE.length)];
      },
      backgroundColor: 'transparent',
      rotateRatio: 0.3,
      minRotation: -Math.PI / 6,
      maxRotation: Math.PI / 6,
      // 权重 w 范围 1-10。用 sqrt 压缩让低权重词不至于太小：
      // w=10 → 68px（最大词，醒目），w=5 → 48px，w=1 → 22px（下限，保证可读）
      weightFactor: function (w) { return Math.max(22, Math.sqrt(w / 10) * 68); },
      click: function (item) {
        if (!item) return;
        var hit = null;
        for (var i = 0; i < tags.length; i++) {
          if (tags[i].name === item[0]) { hit = tags[i]; break; }
        }
        if (hit) window.location.href = '/zzh-notes/' + hit.path;
      }
    };
  }

  // HiDPI 抗锯齿：把缓冲区按 devicePixelRatio 放大，再用 ctx.scale 校回 CSS 坐标系
  // 这样 wordcloud2.js 拿到的仍是 CSS 像素尺寸，字号不会被 CSS 二次缩水
  function setupCanvas(canvas, cssW, cssH) {
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';
    var ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  loadScript('https://cdn.jsdelivr.net/npm/wordcloud@1.2.2/src/wordcloud2.js')
    .then(function () {
      if (typeof window.WordCloud !== 'function') {
        console.warn('[ZZH] wordcloud2.js 未正确加载，标签云降级为默认样式');
        return;
      }

      var canvas = document.createElement('canvas');
      canvas.className = 'wordcloud-canvas';
      // CSS 显示宽 = 父容器宽；高度按标签数给足，至少 480px，最多 720px
      var cssW = parent.clientWidth;
      var cssH = Math.max(480, Math.min(720, tags.length * 22));
      setupCanvas(canvas, cssW, cssH);
      parent.insertBefore(canvas, oldBox);
      oldBox.hidden = true;   // 隐藏原云，保留 DOM 作降级 fallback

      try {
        window.WordCloud(canvas, buildOptions(canvas));

        // 暴露调试句柄（与 window.__zzhStarfield 风格一致）
        window.__zzhWordcloud = { canvas: canvas, tags: tags };

        // resize 重绘（debounce 150ms）
        var rt;
        window.addEventListener('resize', function () {
          clearTimeout(rt);
          rt = setTimeout(function () {
            setupCanvas(canvas, parent.clientWidth, cssH);
            window.WordCloud(canvas, buildOptions(canvas));
          }, 150);
        });
      } catch (err) {
        console.warn('[ZZH] 词云初始化异常，降级为默认标签云：', err);
        if (canvas.parentNode) canvas.remove();
        oldBox.hidden = false;   // 恢复原云
      }
    })
    .catch(function () {
      console.warn('[ZZH] wordcloud2.js 加载失败，标签云降级为默认样式');
    });
})();
</script>




<script>
(() => {
  'use strict';
  const CONFIG = {
    TIME_ZONE: 'Asia/Shanghai',
    LOCALE: 'zh-CN',
    LOCATION_TEXT: 'Shanghai, China'
  };
  let timerId = null;

  function pad2(value) {
    return String(value).padStart(2, '0');
  }

  // 用 Intl 按指定时区拆出 year/month/day/hour/minute/second，避免本地时区干扰
  function getParts(date) {
    const parts = new Intl.DateTimeFormat('en-GB', {
      timeZone: CONFIG.TIME_ZONE,
      hour12: false,
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit'
    }).formatToParts(date);
    const result = {};
    for (const item of parts) {
      if (item.type !== 'literal') {
        result[item.type] = Number(item.value);
      }
    }
    return result;
  }

  function getDateText(date) {
    return new Intl.DateTimeFormat(CONFIG.LOCALE, {
      timeZone: CONFIG.TIME_ZONE,
      weekday: 'short', month: 'short', day: 'numeric'
    }).format(date);
  }

  // 取 UTC 偏移文本（如 UTC+08:00），用 longOffset 再把 GMT 换成 UTC
  function getUtcOffset(date) {
    const dtf = new Intl.DateTimeFormat('en-US', {
      timeZone: CONFIG.TIME_ZONE,
      timeZoneName: 'longOffset',
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit'
    });
    const part = dtf.formatToParts(date).find(item => item.type === 'timeZoneName');
    return part ? part.value.replace('GMT', 'UTC') : 'UTC';
  }

  function updateCard() {
    const card = document.getElementById('zzh-clock-card');
    if (!card) return;   // 卡片未注入（如未配置 sidebar）则静默退出
    const now = new Date();
    const parts = getParts(now);
    // en-GB hour12:false 在午夜可能返回 hour=24，规整为 0
    const hour = parts.hour === 24 ? 0 : parts.hour;
    const minute = parts.minute;
    const second = parts.second;

    const timeEl = card.querySelector('[data-clock-time]');
    const locationEl = card.querySelector('[data-clock-location]');
    const dateEl = card.querySelector('[data-clock-date]');
    const hourHand = card.querySelector('[data-hour-hand]');
    const minuteHand = card.querySelector('[data-minute-hand]');
    const secondHand = card.querySelector('[data-second-hand]');

    if (timeEl) timeEl.textContent = pad2(hour) + ':' + pad2(minute);
    if (locationEl) locationEl.textContent = CONFIG.LOCATION_TEXT;
    if (dateEl) dateEl.textContent = getDateText(now) + ' · ' + getUtcOffset(now);

    // 模拟时钟指针角度：时针随分秒平滑、分针随秒平滑、秒针跳秒
    if (hourHand) {
      const angle = (hour % 12) * 30 + minute * 0.5 + second / 120;
      hourHand.style.transform = 'translateX(-50%) rotate(' + angle + 'deg)';
    }
    if (minuteHand) {
      const angle = minute * 6 + second * 0.1;
      minuteHand.style.transform = 'translateX(-50%) rotate(' + angle + 'deg)';
    }
    if (secondHand) {
      const angle = second * 6;
      secondHand.style.transform = 'translateX(-50%) rotate(' + angle + 'deg)';
    }
  }

  function initClockCard() {
    // 防重复：多次调用先清旧定时器
    if (timerId !== null) {
      window.clearInterval(timerId);
      timerId = null;
    }
    updateCard();
    timerId = window.setInterval(updateCard, 1000);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initClockCard, { once: true });
  } else {
    initClockCard();
  }

  // NexT 开启 PJAX 时，页面主体可能被替换，因此重新初始化组件
  document.addEventListener('pjax:complete', initClockCard);
})();
</script>
